<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spin-off Ledger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101417">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101417'/%3E%3Cpath d='M20 44V20h8c7 0 11 4 11 12s-4 12-11 12h-8z' fill='none' stroke='%23c79a5f' stroke-width='3.5'/%3E%3Ccircle cx='46' cy='22' r='4' fill='%23c79a5f'/%3E%3C/svg%3E">

<style>
:root{
  --paper:#101417; --surface:#171d21; --surface-2:#1e252a;
  --charcoal:#0a0d10; --charcoal-2:#161b1f;
  --cream:#f2ece1; --ink:#f2ece1; --ink-2:#c3bcb1; --muted:#8d857a;
  --bronze:#c79a5f; --bronze-2:#e0bb87; --on-accent:#12171a;
  --solid:#e6dfd2; --solid-ink:#12171a;
  --line:rgba(214,173,116,.26); --wash:rgba(242,236,225,.09);
  --ok:#79ad88; --warn:#d9a253; --stop:#d4796e; --sky:#7fa3c3;
  --radius:14px; --shadow:0 18px 50px rgba(0,0,0,.45);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --paper:#fff; --surface:#fff; --surface-2:#fff;
    --charcoal:#121619; --charcoal-2:#f2efe9;
    --cream:#121619; --ink:#121619; --ink-2:#3d4448; --muted:#645e56;
    --bronze:#8a6636; --bronze-2:#8a6636; --on-accent:#fff;
    --solid:#121619; --solid-ink:#fff;
    --line:rgba(0,0,0,.28); --wash:rgba(0,0,0,.10);
    --ok:#2f6b41; --warn:#8a5a12; --stop:#8c2f26; --sky:#2f5878;
    --shadow:none;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:400 15px/1.6 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:0 30px 110px}
.narrow{max-width:940px}

/* top bar, matching Goal Studio's */
.top{flex-wrap:wrap;position:sticky;top:0;z-index:20;background:var(--charcoal);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:26px;padding:16px 30px;margin-bottom:34px}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--bronze);display:grid;place-items:center;
  font:600 15px/1 'Cormorant Garamond',serif;color:var(--bronze)}
.brand h1{white-space:nowrap;font:500 20px/1 'Cormorant Garamond',serif;letter-spacing:.16em;text-transform:uppercase;margin:0;color:var(--cream)}
.brand small{display:block;font:400 9.5px/1 Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);margin-top:5px}
nav{margin-left:auto;display:flex;align-items:center;gap:6px}
nav button{font:500 12px/1 Inter,sans-serif;letter-spacing:.13em;text-transform:uppercase;
  background:none;border:0;color:var(--muted);padding:11px 15px;border-radius:999px;cursor:pointer}
nav button:hover{color:var(--cream)}
nav button.on{background:var(--bronze);color:var(--on-accent)}
.savedchip{font:500 11px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:12px}

h2{font:500 30px/1.1 'Cormorant Garamond',serif;margin:0 0 6px;color:var(--cream)}
.sub{color:var(--muted);font-size:13px;max-width:62ch}
.eyebrow{font:600 10.5px/1 Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--bronze);margin:0 0 12px}

.stats{display:flex;gap:12px;margin:22px 0 26px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 20px;min-width:112px}
.stat b{display:block;font:500 26px/1 'Cormorant Garamond',serif;color:var(--cream)}
.stat span{display:block;font:500 9.5px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:7px}

.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.tabs{display:flex;gap:4px}
.tab{font:500 12px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:10px 16px;
  border-radius:999px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer}
.tab:hover{color:var(--cream)}
.tab[aria-selected="true"]{background:var(--wash);color:var(--bronze-2);border-color:var(--line)}
.btn{font:500 12.5px/1 Inter,sans-serif;padding:11px 18px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--bronze);color:var(--bronze-2)}
.btn.solid{background:var(--bronze);border-color:var(--bronze);color:var(--on-accent)}
.btn.solid:hover{background:var(--bronze-2);color:var(--on-accent)}
.btn:focus-visible,.tab:focus-visible,nav button:focus-visible,a:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.tablewrap{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow-x:auto;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:1060px}
thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);
  font:600 9.5px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:14px 16px;border-bottom:1px solid var(--wash);vertical-align:middle}
tbody tr:hover{background:var(--wash)}
tbody tr:last-child td{border-bottom:0}
.nm{font-weight:500;color:var(--cream)}
.mono{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink-2)}
td.par{color:var(--ink-2)}
.dash{color:var(--muted)}

.chip{display:inline-block;font:500 9.5px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;
  padding:6px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.chip.announced{color:var(--warn);border-color:rgba(217,162,83,.4)}
.chip.trading{color:var(--bronze-2);border-color:var(--line)}
.chip.closed{color:var(--muted);border-color:var(--line)}
.chip.passed{color:var(--stop);border-color:rgba(212,121,110,.4)}
.chip.yes{color:var(--ok);border-color:rgba(121,173,136,.45)}
.chip.none{color:var(--stop);border-color:rgba(212,121,110,.4)}
.chip.unclear{color:var(--warn);border-color:rgba(217,162,83,.4)}

.score{display:inline-flex;gap:4px}
.sdot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;
  font:600 9px/1 ui-monospace,Menlo,monospace;border:1px solid var(--line);color:var(--muted)}
.sdot.y{background:var(--bronze);border-color:var(--bronze);color:var(--on-accent)}
.sdot.n{border-color:var(--stop);color:var(--stop)}

a.open{font:500 11.5px/1 Inter,sans-serif;color:var(--bronze-2);text-decoration:none;border:1px solid var(--line);
  border-radius:999px;padding:8px 13px;display:inline-block;white-space:nowrap}
a.open:hover{border-color:var(--bronze);background:var(--wash)}
a.open .n{color:var(--muted);font-weight:400}

/* research */
.back{display:inline-block;font:500 12px/1 Inter,sans-serif;letter-spacing:.08em;color:var(--muted);
  text-decoration:none;margin-bottom:24px}
.back:hover{color:var(--bronze-2)}
.rhead{padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:26px}
.meta{display:flex;flex-wrap:wrap;gap:26px;margin-top:14px}
.meta span{display:block;font:600 9.5px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.meta b{font:500 13px/1 ui-monospace,Menlo,monospace;color:var(--ink-2)}
.convention{background:var(--wash);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 18px;font-size:13px;color:var(--ink-2);margin-bottom:24px}

details.blk{margin-bottom:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
details.blk>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:13px;
  font:600 11px/1 Inter,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-2)}
details.blk>summary::-webkit-details-marker{display:none}
details.blk>summary:hover{color:var(--bronze-2)}
details.blk>summary .car{color:var(--muted);font-size:9px;transition:transform .15s}
details.blk[open]>summary .car{transform:rotate(90deg)}
details.blk>summary .fill{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--wash);border:1px solid var(--line)}
details.blk.done>summary .fill{background:var(--bronze);border-color:var(--bronze)}
.blkbody{padding:0 18px 20px}
.why{font-size:12.5px;color:var(--muted);margin:0 0 12px;max-width:74ch}
ul.prompts{margin:0 0 14px;padding-left:19px;color:var(--muted);font-size:12.5px;line-height:1.85}
ul.prompts b{color:var(--ink-2);font-weight:500}
textarea,input,select{width:100%;font:400 14px/1.65 Inter,sans-serif;color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-radius:10px;padding:12px 14px}
textarea{resize:vertical;min-height:120px}
textarea.tall{min-height:300px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--bronze);outline-offset:-1px}
.crit{display:flex;gap:13px;align-items:flex-start;margin-bottom:10px}
.crit select{width:104px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
label.fl{display:block;font:600 9.5px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
ul.srcs{list-style:none;margin:14px 0 0;padding:14px 0 0;border-top:1px solid var(--wash)}
ul.srcs li{margin:0 0 10px;font-size:12.5px;line-height:1.65}
ul.srcs q{color:var(--ink-2);font-style:italic}
ul.srcs a{display:inline-block;margin-left:7px;color:var(--bronze-2);text-decoration:none;font:500 10.5px/1 Inter,sans-serif;
  border:1px solid var(--line);border-radius:999px;padding:5px 9px;white-space:nowrap}
ul.srcs a:hover{border-color:var(--bronze)}
ul.srcs .lbl{display:block;font:600 9px/1 Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
section.blk{margin-bottom:32px}
section.blk>h3{font:600 10.5px/1 Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze);margin:0 0 6px}
button.link{background:none;border:0;padding:0;color:var(--stop);cursor:pointer;font:500 12.5px/1 Inter,sans-serif;
  text-decoration:underline;text-underline-offset:3px}
a.filing{color:var(--bronze-2);font-size:13px;text-decoration:none;border-bottom:1px solid var(--line)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.note{margin-top:18px;font-size:12.5px;color:var(--muted);max-width:76ch}

/* data page */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin-bottom:18px;max-width:640px}
.panel p{font-size:13px;color:var(--muted);margin:0 0 16px;line-height:1.7}
.panel .row{display:flex;gap:10px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:26px;z-index:60}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  max-width:760px;width:100%;max-height:86vh;overflow:auto;padding:28px;box-shadow:var(--shadow)}
.modal h3{font:500 24px/1.15 'Cormorant Garamond',serif;margin:0 0 8px;color:var(--cream)}
.modal textarea{min-height:230px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.prev{background:var(--wash);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-top:13px;font-size:12.5px;line-height:1.8}
</style>
</head>

tion.\nRecord and distribution dates were blank in this filing (preliminary). Actual first trade: 6 July 2026.", "ra": "What the filing supports, and what it doesn't:\n\nAGAINST forced selling being large here —\n- 1-for-1 ratio. Every Middleby holder receives a full-sized MFP position, not an odd stub they can ignore. The classic mechanism (a small unwanted sliver) is largely absent.\n- Not a micro-cap. $853m of net sales, $152m Adjusted EBITDA on the carve-out basis.\n- Nasdaq-listed, both entities.\n\nSTILL POSSIBLY SUPPORTING —\n- Different business character: food processing capital equipment versus commercial foodservice. Some holders bought Middleby for the restaurant-equipment story.\n- The spinco carries new debt it did not have before (see section 7) and did not previously look leveraged.\n\nNOT ESTABLISHED from the Form 10 — index eligibility, expected analyst coverage, and whether MFP will pay a dividend. These need the 8-A, the first index announcements, and post-listing coverage.", "rb": "IMPORTANT NEGATIVE FINDING.\n\nExisting Middleby RSU and PSU awards held by SpinCo employees are CONVERTED into SpinCo-denominated awards using \"a conversion ratio intended to preserve the intrinsic value of the awards.\"\n\nThat means the Greenblatt mechanism — new options struck at the initial trading price, giving management a reason to want a weak open and then to promote afterwards — is NOT present in the way the checklist assumes. These are conversions of pre-existing awards, economically neutral to the opening price.\n\nNot established from this filing: any new founder or inducement grants at listing, the size of grants relative to salary, insider ownership percentages, or which executives moved across. The preliminary Form 10 does not carry them. The first DEF 14A and the Form 3s at listing will.", "rc": "The parent's own case is a multiple re-rating: Food Processing \"to be valued in-line with key food processing peers.\"\n\nTo test that you need the peer set and their multiples, which the filing does not provide. The raw inputs it does give: $853m sales, $152m Adjusted EBITDA on the carve-out basis, ~$110m adjusted for standalone costs, $278.5m of net debt at separation, and a 1-for-1 share count with Middleby.\n\nNo sum-of-the-parts arithmetic is possible from the Form 10 alone — it needs Middleby's pre-spin market cap and the peer multiples. That is the work, and it is section 11's input, not the filing's.", "verdict": "", "buy": "", "sell": "", "report": "", "why": "Stated reason: the two businesses are \"inherently different\" and each will be better focused standalone.\n\nThe stated benefits, in the company's own order:\n- a renewed focus on individual core strategies, \"driving a full valuation in line with best-in-class peers\"\n- enabling Food Processing \"to be valued in-line with key food processing peers\"\n- an optimized capital structure and capital allocation policy for each\n- enhanced financial and strategic impact of M&A for each business\n\nRead plainly: Middleby is arguing the Food Processing business is being under-valued inside the conglomerate and deserves the food-processing peer multiple. That is a re-rating argument made by the seller, which is worth testing against actual peer multiples rather than accepting.\n\nNot found in the filing: any indication the parent has previously tried to sell this business.", "flags": "$278.5 million of revolving credit facility borrowings are expected to be drawn \"on or about the closing date of the distribution.\"\n\nThe spinco previously ran with NET INTEREST INCOME (see section 7). It is being separated with debt it did not carry as a segment. Whether the proceeds go to the spinco or up to the parent needs the Separation and Distribution Agreement (EX-2.1) — not established here.\n\nNot found: pension deficits, environmental liabilities or litigation being assigned to the spinco. Worth confirming in the Employee Matters Agreement and the Risk Factors.", "econ": "REPORTED (carve-out basis, FY2025):\n  Net sales           $853.2m   (prior years $772.0m, $759.3m — growing)\n  Gross profit        $308.9m\n  Adjusted EBITDA     $152m     (17.8% of sales)\n  Net earnings        $83m\n\nTHE PRO FORMA ADJUSTMENT IS THE STORY. The filing shows both columns side by side:\n\n                          pro forma    historical    difference\n  SG&A                     $248.8m       $207.0m       +$41.8m\n  Income from operations    $59.5m       $101.3m       -$41.8m\n  Interest expense/(income) $15.9m        $(2.0)m      -$17.9m\n  Earnings before tax       $52.3m       $112.0m       -$59.7m\n\nSo standalone costs plus new interest remove roughly $60m of pre-tax earnings — pre-tax earnings fall 53% on a pro forma basis. Against $152m of reported Adjusted EBITDA, the ~$41.8m of added SG&A is about 28%.\n\nTSA: Middleby and SpinCo will each provide services to the other — information technology, payroll and benefits, accounting, finance, compliance and administrative. Charges are set to let the provider \"recover all of its costs, including internal and out-of-pocket costs and a reasonable allocation of overhead costs\" — i.e. at cost, not subsidised. Initial term and extension mechanics are in the agreement; the specific duration was not stated in the passage located.\n\nOperating footprint: 29 manufacturing sites (13 US, 16 international across Denmark, France, Germany, India, Italy, Sweden, UK). 56% of net sales in the US. Aftermarket parts and service is called out as a revenue component.", "bs": "$278.5m revolver drawn at separation under a senior secured credit facility. $2.5m of issuance costs to be capitalised and amortised.\n\nPro forma interest expense $15.9m against historical net interest INCOME of $2.0m. Implied rate on the drawn balance is roughly 5.7%.\n\nCoverage on the pro forma figures: income from operations $59.5m / interest $15.9m = about 3.7x. On Adjusted EBITDA less the standalone SG&A adjustment (~$110m) it is about 6.9x.\n\nNOT ESTABLISHED: the maturity schedule, covenants, revolver capacity versus drawn amount, and whether there is a term loan alongside. Those are in \"Description of Certain Indebtedness\" and the credit agreement exhibit — worth pulling before you rely on the coverage numbers.\n\nNOLs: not addressed in the passages located.", "tax": "Intended to qualify as tax-free to Middleby and its stockholders under Section 355. Conditioned on an opinion of tax counsel to that effect — a condition to the distribution, not a completed fact at filing.\n\nStandard consequence to keep in view: §355(e) restricts post-spin M&A for two years, which delays a takeover catalyst.\n\nNOT ESTABLISHED from the passages located: anti-takeover provisions in the charter and bylaws (EX-3.1/3.2), and the non-compete and IP arrangements with Middleby.", "timing": "Record date and distribution date were left blank in this preliminary Form 10.\nActual first trading day: 6 July 2026.\n\nStill to establish: the when-issued window, the first index rebalance after listing, and the date of the first standalone earnings report.\n\nNo option-strike-setting date applies — the equity awards are conversions of existing Middleby grants, not new grants struck at the opening price (see section 4).", "setup": "", "wrong": "", "sources": {"facts": [{"q": "one share of SpinCo common stock for every one share of Middleby common stock held of record by such Middleby stockholder as of Central Time on , the record date for the distribution. Stockholder", "url": "https://www.sec.gov/Archives/edgar/data/2088281/000119312526202395/d14360dex991.htm#:~:text=one%20share%20of%20SpinCo%20common%20stock%20for%20every%20one%20share%20of%20Middleby%20common%20stock%20held%20of%20record%20by%20such%20Middleby%20stockholder%20as%20of%20Central%20Time%20on%20%2C%20the%20record%20date%20for%20the%20distribution.%20Stockholder"}, {"q": "We intend to apply to list SpinCo common stock on the Nasdaq Stock Market LLC (“Nasdaq”) under the ticker", "url": "https://www.sec.gov/Archives/edgar/data/2088281/000119312526202395/d14360dex991.htm#:~:text=We%20intend%20to%20apply%20to%20list%20SpinCo%20common%20stock%20on%20the%20Nasdaq%20Stock%20Market%20LLC%20%28%E2%80%9CNasdaq%E2%80%9D%29%20under%20the%20ticker"}, {"q": "continuing to own Middleby’s commercial foodservice equipment group", "url": "https://www.sec.gov/Archives/edgar/data/2088281/000119312526202395/d14360dex991.htm#:~:text=continuing%20to%20own%20Middleby%E2%80%99s%20commercial%20foodservice%20equipment%20group"}], "why": [{"q": "Enabling the Food Processing business to be valued in-line with key food processing peers. • Allowing each of Middleby and SpinCo to implement an optimized capital structure and capital allocation policy, best supporting growth opportunities for their respective businesses. •", "url": "https://www.sec.gov/Archives/edgar/data/2088281/000119312526202395/d14360dex991.htm#:~:text=Enabling%20the%20Food%20Processing%20business%20to%20be%20valued%20in-line%20with%20key%20food%20processing%20peers.%20%E2%80%A2%20Allowing%20each%20of%20Middleby%20and%20SpinCo%20to%20implement%20an%20optimized%20capital%20structure%20and%20capital%20allocation%20policy%2C%20best%20supporting%20growth%20opportunities%20for%20their%20respective%20businesses.%20%E2%80%A2"}, {"q": "Allowing each of Middleby and SpinCo to implement an optimized capital structure and capital allocation policy, best supporting growth opportunities for their respective businesses. •", "url": "https://www.sec.gov/Archives/edgar/data/2088281/000119312526202395/d14360dex991.htm#:~:text=Allowing%20each%20of%20Middleby%20and%20SpinCo%20to%20implement%20an%20optimized%20capital%20structure%20and%20capital%20allocation%20policy%2C%20best%20supporting%20growth%20opportunities%20for%20their%20respective%20businesses.%20%E2%80%A2"}], "rb": [{"q": "converted into RSU and PSU awards (as applicable) denominated in shares of SpinCo common stock", "url": "https://www.sec.gov/Archives/edgar/data/2088281/000119312526202395/d14360dex991.htm#:~:text=converted%20into%20RSU%20and%20PSU%20awards%20%28as%20applicable%29%20denominated%20in%20shares%20of%20SpinCo%20common%20stock"}, {"q": "a conversion ratio intended to preserve the intrinsic value of the awards. Middleby", "url": "https://www.sec.gov/Archives/edgar/data/2088281/000119312526202395/d14360dex991.htm#:~:text=a%20conversion%20ratio%20intended%20to%20preserve%20the%20intrinsic%20value%20of%20the%20awards.%20Middleby"}], "flags": [{"q": "approximately $278.5 million of revolving credit facility borrowings expected to be incurred", "url": "https://www.sec.gov/Archives/edgar/data/2088281/000119312526202395/d14360dex991.htm#:~:text=approximately%20%24278.5%20million%20of%20revolving%20credit%20facility%20borrowings%20expected%20to%20be%20incurred"}], "econ": [{"q": "information technology, payroll and benefits, accounting, finance, compliance and administrative activities", "url": "https://www.sec.gov/Archives/edgar/data/2088281/000119312526202395/d14360dex991.htm#:~:text=information%20technology%2C%20payroll%20and%20benefits%2C%20accounting%2C%20finance%2C%20compliance%20and%20administrative%20activities"}, {"q": "generally intended to allow the service provider to recover all of its costs", "url": "https://www.sec.gov/Archives/edgar/data/2088281/000119312526202395/d14360dex991.htm#:~:text=generally%20intended%20to%20allow%20the%20service%20provider%20to%20recover%20all%20of%20its%20costs"}], "bs": [{"q": "We expect to capitalize issuance costs of $2.5 million associated with the senior secured credit facility", "url": "https://www.sec.gov/Archives/edgar/data/2088281/000119312526202395/d14360dex991.htm#:~:text=We%20expect%20to%20capitalize%20issuance%20costs%20of%20%242.5%20million%20associated%20with%20the%20senior%20secured%20credit%20facility"}], "tax": [{"q": "the distribution will qualify as tax-free to Middleby and its stockholders for U.S. federal income tax purposes under Section 355 of the Internal", "url": "https://www.sec.gov/Archives/edgar/data/2088281/000119312526202395/d14360dex991.htm#:~:text=the%20distribution%20will%20qualify%20as%20tax-free%20to%20Middleby%20and%20its%20stockholders%20for%20U.S.%20federal%20income%20tax%20purposes%20under%20Section%20355%20of%20the%20Internal"}], "cat": [{"q": "We do not currently intend to pay any cash dividends in the foreseeable future  (Dividend Policy section)", "url": "https://www.sec.gov/Archives/edgar/data/2088281/000119312526202395/d14360dex991.htm#:~:text=DIVIDEND%20POLICY-,We%20do%20not%20currently%20intend%20to%20pay%20any%20cash%20dividends%20in%20the%20foreseeable%20future"}]}, "cat": "DIVIDEND — explicitly ruled out. The Form 10's Dividend Policy section states SpinCo \"does not currently intend to pay any cash dividends in the foreseeable future,\" intending instead to retain earnings \"for the operation of our business and to strengthen our financial position and flexibility.\"\n\nIt also flags that \"the terms governing our current or future debt may also limit or prohibit dividend payments\" — so even a change of heart could be blocked by the credit agreement. The restricted-payments covenant was not located in this filing; it needs the credit agreement exhibit.\n\nSo the dividend-as-catalyst setup is off the table for MFP as filed.\n\nBUYBACK — no authorisation mentioned. Share repurchases appear only in boilerplate risk-factor language about what moves share prices.\n\n§355(e) — the standard two-year restriction on post-spin M&A applies, so a takeover catalyst is delayed until roughly July 2028.\n\nDELEVERAGING — $278.5m drawn at separation, but no stated paydown target was located.\n\nNOT ESTABLISHED: index inclusion, analyst initiation, management vesting dates, insider open-market buying. Index and coverage resolve after listing; vesting is in the DEF 14A; buying shows in Form 4s.", "catalyst": "none"}, {"name": "(unnamed spinco)", "tick": "", "parent": "Textron, In
