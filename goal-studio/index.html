<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Goal Studio | General Disability Support</title>
<meta name="description" content="Goal setting, activity breakdown, estimation, timeline and calendar in one place." />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#121619" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Goal Studio" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --charcoal:#121619; --charcoal-2:#1b2023; --cream:#f5f1e9; --paper:#fbf8f2;
  --bronze:#b98a51; --bronze-2:#d6ad74; --muted:#80796f; --line:rgba(185,138,81,.28);
  --white:#fffaf2; --ink:#121619; --ink-2:#3d4448;
  --ok:#4b7f5b; --warn:#b3762a; --stop:#a3453b; --sky:#4a6d8c;
  --radius:14px; --shadow:0 18px 50px rgba(18,22,25,.10);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);-webkit-tap-highlight-color:rgba(185,138,81,.18)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
::selection{background:var(--bronze);color:#fff}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;background:var(--charcoal);color:var(--cream);border-bottom:1px solid rgba(214,173,116,.25);
  padding-top:env(safe-area-inset-top,0px)}
.topbar-in{display:flex;align-items:center;gap:22px;padding:12px 20px;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.mark{width:32px;height:32px;border:1px solid var(--bronze);border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.mark:before{content:"";width:12px;height:21px;border:1.5px solid var(--bronze-2);border-left:0;border-radius:0 18px 18px 0;transform:rotate(28deg)}
.brand-title{display:flex;flex-direction:column;line-height:1.15}
.brand-title strong{font-family:'Cormorant Garamond',serif;font-size:22px;letter-spacing:.22em;font-weight:600}
.brand-title span{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--bronze-2);margin-top:3px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tab{background:transparent;border:1px solid transparent;color:var(--cream);opacity:.72;padding:9px 15px;border-radius:999px;cursor:pointer;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.tab:hover{opacity:1;background:rgba(255,255,255,.06)}
.tab.on{opacity:1;background:var(--bronze);border-color:var(--bronze);color:#fff}
.savechip{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--bronze-2);opacity:.85;white-space:nowrap}

/* ---------- layout ---------- */
.wrap{max-width:1400px;margin:0 auto;padding:26px 20px calc(90px + env(safe-area-inset-bottom,0px))}
.pagehead{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;letter-spacing:.01em}
.pagehead p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.spacer{flex:1}

.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:20px}
.grid2{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;align-items:start}
.grid2 > *{min-width:0}   /* grid items default to min-width:auto and refuse to shrink */
@media(max-width:900px){.grid2{grid-template-columns:1fr}}

/* ---------- flow strip ---------- */
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px;padding:14px 16px;border:1px dashed var(--line);border-radius:var(--radius);background:rgba(185,138,81,.05)}
.flow b{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--bronze);font-weight:700}
.flow-step{font-size:12px;color:var(--ink-2);background:var(--white);border:1px solid var(--line);padding:5px 11px;border-radius:999px;white-space:nowrap}
.flow-arrow{color:var(--bronze);opacity:.6;font-size:12px}

/* ---------- buttons ---------- */
.btn{background:var(--charcoal);color:var(--cream);border:1px solid var(--charcoal);padding:10px 17px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600;letter-spacing:.05em;white-space:nowrap}
.btn:hover{background:var(--charcoal-2)}
.btn.primary{background:var(--bronze);border-color:var(--bronze);color:#fff}
.btn.primary:hover{background:#a87b46}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:rgba(185,138,81,.09)}
.btn.sm{padding:6px 12px;font-size:11.5px}
.btn.danger{background:transparent;color:var(--stop);border-color:rgba(163,69,59,.4)}
.btn.danger:hover{background:rgba(163,69,59,.08)}
.iconbtn{background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer;padding:4px 7px;border-radius:8px;font-size:13px;line-height:1}
.iconbtn:hover{background:rgba(185,138,81,.12);color:var(--ink)}
.iconbtn.del:hover{background:rgba(163,69,59,.1);color:var(--stop)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;max-width:100%}
.btnrow > *{max-width:100%}

/* ---------- fields ---------- */
.field{margin-bottom:15px}
.field label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bronze);font-weight:700;margin-bottom:6px}
.field .hint{font-size:12px;color:var(--muted);margin:-2px 0 7px;line-height:1.45}
input[type=text],input[type=date],input[type=number],input[type=time],select,textarea{
  width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--bronze);background:#fff;box-shadow:0 0 0 3px rgba(185,138,81,.13)}
textarea{resize:vertical;min-height:74px;line-height:1.5}
.inline{display:flex;gap:10px;flex-wrap:wrap}
.inline > *{flex:1;min-width:130px}

/* ---------- goal cards ---------- */
.goal-list{display:flex;flex-direction:column;gap:12px}
.goal-card{background:var(--white);border:1px solid var(--line);border-left:5px solid var(--bronze);border-radius:12px;padding:14px 16px;cursor:pointer;transition:.18s}
.goal-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.goal-card.on{border-color:var(--bronze);background:#fff;box-shadow:var(--shadow)}
.goal-card h3{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;margin-bottom:3px}
.goal-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.bar{height:7px;background:rgba(18,22,25,.08);border-radius:99px;overflow:hidden;margin-top:10px}
.bar > i{display:block;height:100%;background:var(--bronze);border-radius:99px;transition:width .3s}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:rgba(75,127,91,.35);background:rgba(75,127,91,.08)}
.chip.warn{color:var(--warn);border-color:rgba(179,118,42,.35);background:rgba(179,118,42,.08)}
.chip.stop{color:var(--stop);border-color:rgba(163,69,59,.35);background:rgba(163,69,59,.08)}
.chip.sky{color:var(--sky);border-color:rgba(74,109,140,.35);background:rgba(74,109,140,.08)}

.section-title{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--bronze);font-weight:700;margin:0 0 12px}
.divider{height:1px;background:var(--line);margin:20px 0}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty h3{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--ink);margin-bottom:8px}

/* ---------- SMART block ---------- */
.smart-row{display:grid;grid-template-columns:34px 1fr;gap:12px;margin-bottom:14px;align-items:start}
.smart-key{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;background:rgba(185,138,81,.12);color:var(--bronze);border:1px solid var(--line)}
.smart-row.filled .smart-key{background:var(--bronze);color:#fff;border-color:var(--bronze)}
.smart-row label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bronze);font-weight:700;margin-bottom:4px}
.smart-row .hint{font-size:12px;color:var(--muted);margin:0 0 6px}
.smart-score{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;background:rgba(185,138,81,.07);border:1px solid var(--line);margin-bottom:16px;font-size:12.5px}

/* ---------- activity tree ---------- */
.tree{display:flex;flex-direction:column;gap:6px}
.node{border:1px solid var(--line);border-radius:11px;background:var(--white)}
.node.done{opacity:.62}
.node.blocked{border-color:rgba(163,69,59,.4)}
.node-main{display:flex;align-items:center;gap:9px;padding:9px 11px}
.node-title{flex:1;min-width:120px;border:1px solid transparent;background:transparent;padding:5px 7px;border-radius:7px;font-weight:500}
.node-title:hover{background:var(--paper)}
.node.done .node-title{text-decoration:line-through;color:var(--muted)}
.wave-tag{font-size:9.5px;letter-spacing:.1em;font-weight:700;color:var(--bronze);background:rgba(185,138,81,.12);border:1px solid var(--line);border-radius:5px;padding:2px 5px;white-space:nowrap}
.est{width:70px!important;flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums;padding:6px 8px}
.unit{font-size:10.5px;color:var(--muted);flex:0 0 auto;margin-left:-4px;letter-spacing:.04em}
.dt.empty{color:var(--muted);opacity:.45}
.dt.empty:focus,.dt.empty:hover{opacity:1}
.dt{width:138px!important;flex:0 0 auto;padding:6px 8px;font-size:12.5px}
.node-status{width:104px!important;flex:0 0 auto;padding:6px 8px;font-size:12px}
.kids{margin:0 0 8px 26px;padding-left:14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.node-when{display:contents}
.rowmove{display:flex;gap:2px}
.node-extra{padding:0 11px 11px 40px;display:none}
.node.open .node-extra{display:block}
.tick{width:19px;height:19px;flex:0 0 auto;border:1.5px solid var(--line);border-radius:5px;background:var(--white);cursor:pointer;display:grid;place-items:center;color:transparent;font-size:12px;line-height:1;padding:0}
.tick.on{background:var(--bronze);border-color:var(--bronze);color:#fff}
.rollup{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
@media(max-width:760px){
  .g-left{flex-basis:148px;max-width:148px}
  .node-main{flex-wrap:wrap}
  .dt,.node-status,.est{width:auto!important;flex:1 1 110px}
}

/* ---------- gantt ---------- */
.gantt{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--white)}
.g-left{flex:0 0 268px;max-width:268px;min-width:0;border-right:1px solid var(--line);background:var(--white);z-index:2}
.g-right{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden}
.g-head{height:46px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;background:rgba(185,138,81,.06);position:relative}
.g-row{height:34px;display:flex;align-items:center;border-bottom:1px solid rgba(185,138,81,.14);position:relative}
.g-left .g-row{padding:0 12px;gap:7px;font-size:12.5px;overflow:hidden}
.g-left .g-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-row.goalrow{background:rgba(185,138,81,.07);font-weight:600}
.g-canvas{position:relative}
.g-tick{position:absolute;top:0;bottom:0;border-left:1px solid rgba(185,138,81,.16)}
.g-tick.strong{border-left-color:rgba(185,138,81,.4)}
.g-weekend{position:absolute;top:0;bottom:0;background:rgba(18,22,25,.035)}
.g-lbl{position:absolute;bottom:5px;font-size:10.5px;color:var(--muted);letter-spacing:.06em;white-space:nowrap;padding-left:5px}
.g-mon{position:absolute;top:5px;font-size:11px;font-weight:700;color:var(--bronze);letter-spacing:.1em;text-transform:uppercase;padding-left:5px;white-space:nowrap}
.g-bar{position:absolute;height:17px;top:8px;border-radius:5px;background:var(--bronze);color:#fff;font-size:10.5px;line-height:17px;padding:0 7px;overflow:hidden;white-space:nowrap;cursor:default}
.g-bar.summary{height:11px;top:11px;border-radius:3px;background:var(--charcoal);opacity:.85}
.g-bar.done{background:var(--ok)}
.g-bar.late{background:var(--stop)}
.g-bar.sched{opacity:.55;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.25) 0 5px,transparent 5px 10px)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--stop);opacity:.55;z-index:3}
.g-fill{position:absolute;left:0;top:0;bottom:0;background:rgba(18,22,25,.45);border-right:1px solid rgba(255,255,255,.6);border-radius:5px 0 0 5px}
.g-name{position:absolute;top:0;height:34px;line-height:34px;font-size:11.5px;color:var(--ink-2);white-space:nowrap;pointer-events:none}
.g-none{position:absolute;left:6px;top:0;height:34px;line-height:34px;font-size:11px;color:var(--muted);font-style:italic}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:14px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;line-height:1.1}
.stat span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- misc ---------- */
.note{font-size:12.5px;color:var(--muted);line-height:1.6}
p,li,.note,.stat span{overflow-wrap:anywhere}   /* long URLs must wrap, not push the page sideways */
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--charcoal);color:var(--cream);padding:12px 22px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.modal-bg{position:fixed;inset:0;background:rgba(18,22,25,.55);display:none;place-items:center;z-index:150;padding:20px}
.modal-bg.on{display:grid}
.modal{background:var(--white);border-radius:var(--radius);max-width:520px;width:100%;padding:24px;box-shadow:var(--shadow)}
.modal h3{font-family:'Cormorant Garamond',serif;font-size:24px;margin-bottom:6px}
ul.tight{margin:8px 0 0;padding-left:18px}
ul.tight li{margin-bottom:5px;color:var(--ink-2)}
/* ---------- phones: a compact shell so the work starts above the fold ---------- */
@media(max-width:700px){
  .topbar-in{padding:9px 13px;gap:9px}
  .brand-title strong{font-size:17px;letter-spacing:.16em}
  .brand-title span{display:none}
  .brand{order:1}
  .savechip{order:2;margin-left:auto;font-size:9.5px}
  .tabs{order:3;width:100%;margin-left:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:7px 13px;font-size:11.5px;flex:0 0 auto}
  .mark{width:27px;height:27px}
  .mark:before{width:10px;height:17px}
  .flow{display:none}
  .wrap{padding:16px 13px calc(70px + env(safe-area-inset-bottom,0px))}
  .pagehead{margin-bottom:14px;gap:10px}
  .pagehead h1{font-size:26px}
  .pagehead p{display:none}                  /* the guidance lives on the Data tab */
  .pagehead .keep{display:block;font-size:12.5px}
  .pad{padding:15px}
  .stats{display:flex;overflow-x:auto;gap:8px;padding-bottom:3px;scrollbar-width:none}
  .stats::-webkit-scrollbar{display:none}
  .stat{flex:0 0 auto;min-width:98px;padding:9px 13px}
  .stat b{font-size:21px}
  .stat span{font-size:9px;letter-spacing:.1em}
  .goal-card h3{font-size:18px}
  .kids{margin-left:12px;padding-left:9px}
  /* One activity, one line: dates and status wait behind ✎ */
  .node-when{display:none}
  .node.open .node-when{display:flex;flex-wrap:wrap;gap:7px;width:100%;margin-top:2px}
  .node-main{gap:7px;padding:8px 9px}
  /* line 1: tick, wave tag, title — line 2: estimate, rollup, tools.
     Scoped to the activity row so schedule slots keep their own order. */
  .node-main > .tick{order:1}
  .node-main > .wave-tag{order:2}
  .node-main > .node-title{order:3;flex:1 1 58%;min-width:0}
  .node-main > .est{order:4;flex:0 0 auto;width:66px!important}
  .node-main > .unit{order:5}
  .node-main > .rollup{order:6}
  .node-main > .node-when{order:7}
  .node-main > .rowtools{order:8;margin-left:auto}
  .rowmove{display:none}                     /* reordering waits behind ✎ too */
  .node.open .rowmove{display:flex}
  .iconbtn{padding:8px 9px}
  .node-when .dt,.node-when .node-status{flex:1 1 44%}
  .node-extra{padding:0 10px 10px 10px}
  .slot{flex-wrap:wrap;gap:7px}
  .slot .time{min-width:0}
  .smart-row{grid-template-columns:28px 1fr;gap:9px}
  .smart-key{width:28px;height:28px;font-size:16px}
}
/* Fingers need more than a mouse does. */
@media(pointer:coarse){
  .tick{width:30px;height:30px;font-size:16px}
  .iconbtn{padding:9px 11px;font-size:15px;min-height:38px}
  .btn.sm{padding:9px 14px}
  .node-title,.est,.dt,.node-status{padding-top:9px;padding-bottom:9px}
}

/* ---------- week planner ---------- */
.availbar{display:flex;align-items:center;gap:11px;flex-wrap:wrap;background:var(--white);
  border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.avail-summary{display:none;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.avail-summary .linky{padding:0;margin-left:4px}
.bar-lbl{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--bronze);font-weight:700}
.dim{color:var(--muted);font-size:12px}
.vsep{width:1px;align-self:stretch;background:var(--line)}
.timefield{width:70px!important;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;
  padding:5px 6px;background:transparent;border-color:transparent}
.timefield:hover{border-color:var(--line)}
.dayrow{display:flex;gap:3px}
.daybtn{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:transparent;
  color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer}
.daybtn[aria-pressed="true"]{background:var(--bronze);border-color:var(--bronze);color:#fff}
.daybtn:hover{border-color:var(--bronze)}

.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:rgba(179,118,42,.08);
  border:1px solid rgba(179,118,42,.35);border-left:4px solid var(--warn);border-radius:12px;
  padding:12px 15px;margin-bottom:14px;font-size:13px}
.banner > div:first-child{flex:1;min-width:220px}

.work{display:grid;grid-template-columns:246px 1fr;gap:16px;align-items:start}
.work > *{min-width:0}
.rail{background:var(--white);border:1px solid var(--line);border-radius:13px;padding:15px}
.railsub{color:var(--muted);font-size:11.5px;margin:0 0 10px}
.railsub.ok{color:var(--ok)}
.qchips{display:flex;flex-direction:column;gap:6px}
.qchip{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--paper);
  border:1px solid var(--line);border-left:3px solid var(--bronze);border-radius:9px;padding:8px 10px;
  cursor:grab;touch-action:none}
.qchip:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.qchip .t{flex:1;min-width:0;font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qchip .d{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.noest{margin-top:12px;padding:10px 11px;border:1px solid rgba(179,118,42,.35);

.wklegend{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;

.fc{border:1px solid var(--line);border-left:4px solid var(--bronze);border-radius:10px;padding:11px 12px;
  margin-bottom:9px;background:var(--paper)}

.fcmeta{display:flex;gap:9px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin:7px 0 2px;
  font-variant-numeric:tabular-nums}
.chip.flat{width:100%;justify-content:center;margin-top:5px;font-size:11px;padding:5px 8px;text-align:center}
.linky{background:none;border:0;padding:6px 0 0;color:var(--bronze);font-size:11.5px;font-weight:600;
  cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.levers{display:flex;flex-direction:column;gap:5px;margin-top:7px}
.lever{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--white);
  border:1px solid var(--line);border-radius:8px;padding:7px 9px;cursor:pointer;font-size:11.5px;text-align:left}

  color:var(--muted);font-weight:600;border-left:1px solid var(--line-soft,rgba(185,138,81,.14))}
.calhead > div:first-child{border-left:0}

.calhead b{display:block;font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--ink);
  text-transform:none;letter-spacing:0}
.calbody{overflow-y:auto;max-height:min(66vh,620px)}
.calgrid{display:grid;grid-template-columns:50px repeat(7,1fr);position:relative}
.gutter{position:relative}
.gutter span{position:absolute;right:6px;font-size:10px;color:var(--muted);
  font-variant-numeric:tabular-nums;transform:translateY(-6px)}
.col{position:relative;border-left:1px solid rgba(185,138,81,.14);touch-action:none}
.col.off{background:repeating-linear-gradient(-45deg,transparent 0 7px,rgba(185,138,81,.10) 7px 8px)}
.band{position:absolute;left:0;right:0;background:rgba(185,138,81,.07);pointer-events:none}

.blk{position:absolute;left:3px;right:3px;border-radius:7px;padding:3px 6px;overflow:hidden;cursor:grab;

.blk .grip{position:absolute;left:0;right:0;bottom:0;height:9px;cursor:ns-resize;touch-action:none}
.blk .grip:after{content:"";position:absolute;left:50%;bottom:2px;width:18px;height:2px;margin-left:-9px;

.blk:hover .grip:after{opacity:.5}
.bdone{position:absolute;top:2px;right:2px;width:17px;height:17px;border-radius:5px;border:1px solid currentColor;

<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="mark"></div>
      <div class="brand-title"><strong>GOAL STUDIO</strong><span>General Disability Support</span></div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-tab="goals">Goals</button>
      <button class="tab" data-tab="activities">Activities</button>
      <button class="tab" data-tab="timeline">Timeline</button>
      <button class="tab" data-tab="schedule">Schedule</button>
      <button class="tab" data-tab="data">Data</button>
    </nav>
    <div class="savechip" id="savechip">&nbsp;</div>
  </div>
</header>

<main class="wrap" id="app"></main>

<div id="toast"></div>
<div class="modal-bg" id="modalbg">
  <div class="modal" id="modal"></div>
</div>

<script>
"use strict";

/* =====================================================================
   Goal Studio — one connected chain:
   Goal → SMART framing → Activities → Wave breakdown → Estimates
        → Auto-schedule → Timeline (Gantt) → Calendar (.ics)
   All data lives in this browser (localStorage). No server, no account.
   ===================================================================== */

const KEY = "gds.goalstudio.v1";
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 10);
const h = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

/* Grid geometry. Declared up here on purpose: load() reaches for clampMin,
   and a `const` further down the file is still in its dead zone by then. */
const T0 = 5*60, T1 = 23*60;            // hard limits for any stored time
let V0 = 8*60, V1 = 19*60;              // the slice of day the grid draws — set per render
const PXMIN = 52/60, SNAP = 15;
const GOAL_COLOURS = ["#b98a51","#4b7f5b","#4a6d8c","#7a4f6d","#a3653b","#3f7d78"];

/* ---------- dates (all ISO yyyy-mm-dd, parsed local to dodge UTC drift) -- */
const pad = n => String(n).padStart(2, "0");
function iso(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function parseISO(s){
  if(!s) return null;
  const p = String(s).split("-").map(Number);
  if(p.length < 3 || !p[0]) return null;
  const d = new Date(p[0], p[1]-1, p[2]);
  return isNaN(d) ? null : d;
}
function today(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function todayISO(){ return iso(today()); }
function addDays(s, n){ const d = parseISO(s) || today(); d.setDate(d.getDate()+n); return iso(d); }
function daysBetween(a, b){
  const x = parseISO(a), y = parseISO(b);
  if(!x || !y) return 0;
  return Math.round((y - x) / 86400000);
}
function dow(s){ const d = parseISO(s); return d ? d.getDay() : 0; }  // 0 Sun … 6 Sat
const DAYNAME = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONNAME = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function prettyDate(s){
  const d = parseISO(s);
  if(!d) return "—";
  return DAYNAME[d.getDay()] + " " + d.getDate() + " " + MONNAME[d.getMonth()] +
         (d.getFullYear() !== today().getFullYear() ? " " + d.getFullYear() : "");
}
function shortDate(s){ const d = parseISO(s); return d ? d.getDate() + " " + MONNAME[d.getMonth()] : "—"; }
function minsToText(m){
  m = Math.round(m || 0);
  if(!m) return "0h";
  const hh = Math.floor(m/60), mm = m%60;
  return (hh ? hh + "h" : "") + (mm ? (hh ? " " : "") + mm + "m" : "");
}
function hhmm(m){ m = clampMin(Number(m) || 0); return pad(Math.floor(m/60)) + ":" + pad(m%60); }
function parseTime(str, fallback){
  const m = /^(\d{1,2})\s*[:.h]?\s*(\d{2})?/.exec(String(str).trim());
  if(!m) return fallback;
  return clampMin((+m[1]) * 60 + (+(m[2] || 0)));
}
function timeOfDay(mins){
  const hh = Math.floor(mins/60) % 24, mm = Math.round(mins) % 60;
  const ap = hh < 12 ? "am" : "pm";
  const h12 = hh % 12 === 0 ? 12 : hh % 12;
  return h12 + (mm ? ":" + pad(mm) : "") + ap;
}

/* ---------- state ---------- */
const DEFAULT_SETTINGS = {
  availFrom: 9 * 60,          // the hours you are free to work on your own goals
  availTo:  17 * 60,
  availDays: [1,2,3,4,5],     // Mon–Fri
  defaultEstimate: 60         // minutes given to a newly added activity
};

let loadError = null;    // set when saved data could not be read
let rawSaved = null;     // the untouched file, kept so it can still be rescued
let S = load();
let saveTimer = null;

function blank(){
  return { version: 2, goals: [], blocks: [], settings: Object.assign({}, DEFAULT_SETTINGS),
           ui: { tab:"goals", goalId:null, scale:"week", weekStart:null, viewDay:0, openLever:null, collapsed:{} } };
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return blank();
    const d = JSON.parse(raw);
    const s = blank();
    s.goals    = Array.isArray(d.goals) ? d.goals : [];
    s.blocks   = Array.isArray(d.blocks) ? d.blocks : [];
    s.settings = Object.assign({}, DEFAULT_SETTINGS, migrateSettings(d.settings || {}));
    s.ui       = Object.assign(s.ui, d.ui || {});
    s.ui.collapsed = s.ui.collapsed || {};
    s.goals.forEach(normaliseGoal);
    if(!(d.version >= 2)) s.blocks = s.blocks.concat(migrateSchedule(s.goals));
    s.blocks.forEach(b => {
      b.id ||= uid(); b.kind = b.kind === "busy" ? "busy" : "task";
      b.mins = Math.max(15, Number(b.mins) || 60);
      b.startMin = clampMin(Number(b.startMin) || 540);
      b.skip = Array.isArray(b.skip) ? b.skip : [];
      b.pinned = !!b.pinned; b.done = !!b.done;
    });
    return s;
  }catch(e){
    console.warn("Could not read saved data:", e);
    loadError = (e && e.message) || String(e);
    try{ rawSaved = localStorage.getItem(KEY); }catch(err){}
    return blank();
  }
}
/* v1 kept a working day as hours-per-day; v2 keeps the window you are free. */
function migrateSettings(old){
  if(old.availFrom !== undefined) return old;
  const from = Number(old.dayStartMin) || 9*60;
  return {
    availFrom: from,
    availTo: Math.min(23*60, from + (Number(old.hoursPerDay) || 4) * 60),
    availDays: Array.isArray(old.workDays) ? old.workDays : [1,2,3,4,5],
    defaultEstimate: Number(old.defaultEstimate) || 60
  };
}
/* v1 recomputed the schedule from scratch each run; v2 keeps real blocks you
   can drag. Carry the old chunks over so nobody loses their plan. */
function migrateSchedule(goals){
  const out = [];
  goals.forEach(g => eachTask(g.tasks, t => {
    (t.sched || []).forEach(c => {
      if(!c || !c.date) return;
      out.push({ id:uid(), kind:"task", taskId:t.id, title:"", date:c.date,
                 startMin:clampMin(Number(c.startMin) || 540), mins:Math.max(15, Number(c.mins) || 60),
                 pinned:false, done:t.status === "done", repeat:null, skip:[] });
    });
    delete t.sched;
  }));
  return out;
}
function normaliseGoal(g){
  g.id ||= uid();
  g.title ||= "Untitled goal";
  g.smart = Object.assign({ s:"", m:"", a:"", r:"", t:"" }, g.smart || {});
  g.tasks = Array.isArray(g.tasks) ? g.tasks : [];
  g.status ||= "active";
  g.why ||= ""; g.start ||= ""; g.due ||= "";
  (function walk(list){
    list.forEach(t => {
      t.id ||= uid();
      t.title ||= "Untitled activity";
      t.status ||= "todo";
      t.notes ||= "";
      t.est = Number(t.est) || 0;
      t.start ||= ""; t.due ||= "";
      t.kids = Array.isArray(t.kids) ? t.kids : [];
      walk(t.kids);
    });
  })(g.tasks);
}
function save(){
  /* Never write over a plan we failed to read — that turns a display problem
     into permanent data loss. */
  if(loadError){ $("#savechip").textContent = "Not saving"; return; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{
      localStorage.setItem(KEY, JSON.stringify(S));
      keepData();
      const n = new Date();
      $("#savechip").textContent = "Saved " + pad(n.getHours()) + ":" + pad(n.getMinutes());
    }catch(e){
      $("#savechip").textContent = "Save failed";
      toast("Could not save — browser storage may be full or blocked.");
    }
  }, 250);
}

function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove("on"), 2600);
}

/* ---------- tree helpers ---------- */
function eachTask(list, fn, depth, parent){
  depth = depth || 0;
  (list || []).forEach(t => { fn(t, depth, parent || null); eachTask(t.kids, fn, depth+1, t); });
}
function allTasks(g){ const out = []; eachTask(g.tasks, (t,d,p) => out.push({ t, depth:d, parent:p })); return out; }
function findTask(id){
  for(const g of S.goals){
    let hit = null;
    eachTask(g.tasks, (t, d, p) => { if(t.id === id) hit = { goal:g, task:t, parent:p, depth:d }; });
    if(hit) return hit;
  }
  return null;
}
function siblingsOf(goal, task){
  const hit = findTask(task.id);
  return hit && hit.parent ? hit.parent.kids : goal.tasks;
}
function isLeaf(t){ return !t.kids || !t.kids.length; }
/* A container activity is done when its wave is done — never on its own. */
function isDone(t){ return isLeaf(t) ? t.status === "done" : t.kids.every(isDone); }

/* Effort rolls up: a parent's estimate is the sum of its wave, never its own. */
function effort(t){
  if(isLeaf(t)) return Number(t.est) || 0;
  return t.kids.reduce((n, k) => n + effort(k), 0);
}
function doneEffort(t){
  if(isLeaf(t)) return t.status === "done" ? (Number(t.est) || 0) : 0;
  return t.kids.reduce((n, k) => n + doneEffort(k), 0);
}
/* Progress is weighted by effort; unestimated leaves still count as 1 unit. */
function weight(t){ return isLeaf(t) ? Math.max(Number(t.est) || 0, 1) : t.kids.reduce((n,k) => n + weight(k), 0); }
function doneWeight(t){
  if(isLeaf(t)) return t.status === "done" ? Math.max(Number(t.est) || 0, 1) : 0;
  return t.kids.reduce((n,k) => n + doneWeight(k), 0);
}
function goalProgress(g){
  if(!g.tasks.length) return 0;
  const w = g.tasks.reduce((n,t) => n + weight(t), 0);
  const d = g.tasks.reduce((n,t) => n + doneWeight(t), 0);
  return w ? Math.round(d / w * 100) : 0;
}
function goalEffort(g){ return g.tasks.reduce((n,t) => n + effort(t), 0); }
function taskProgress(t){
  const w = weight(t), d = doneWeight(t);
  return w ? Math.round(d / w * 100) : 0;
}
function countLeaves(g){ let n = 0; eachTask(g.tasks, t => { if(isLeaf(t)) n++; }); return n; }
function smartScore(g){ return ["s","m","a","r","t"].filter(k => (g.smart[k] || "").trim().length > 2).length; }

/* A task's effective window: explicit dates first, else the auto-schedule. */
function taskWindow(t){
  let start = t.start || "", end = t.due || "";
  const bl = taskBlocks(t.id).map(b => b.date).sort();
  if(bl.length){
    if(!start) start = bl[0];
    if(!end) end = bl[bl.length-1];
  }
  if(!isLeaf(t)){
    // Summary rows span everything underneath them.
    let lo = start, hi = end;
    t.kids.forEach(k => {
      const w = taskWindow(k);
      if(w.start && (!lo || w.start < lo)) lo = w.start;
      if(w.end   && (!hi || w.end   > hi)) hi = w.end;
    });
    start = lo; end = hi;
  }
  if(start && !end) end = start;
  if(end && !start) start = end;
  return { start, end };
}
function isOverdue(t){
  const w = taskWindow(t);
  return t.status !== "done" && w.end && w.end < todayISO();
}

/* =====================================================================
   RENDER
   ===================================================================== */
function currentGoal(){
  return S.goals.find(g => g.id === S.ui.goalId) || S.goals[0] || null;
}
function rescueBanner(){
  if(!loadError) return "";
  return '<div class="banner" style="border-left-color:var(--stop);background:rgba(163,69,59,.08);' +
    'border-color:rgba(163,69,59,.35)"><div><b>Your saved plan could not be read.</b> ' +
    h(loadError) + '. Nothing has been overwritten and nothing is being saved, so the original file is still ' +
    'intact — download it before doing anything else.</div>' +
    '<div class="btnrow"><button class="btn sm" data-act="rescue">Download the file</button>' +
    '<button class="btn ghost sm" data-act="rescue-reset">Start fresh</button></div></div>';
}
function render(){
  $$("#tabs .tab").forEach(b => b.classList.toggle("on", b.dataset.tab === S.ui.tab));
  const views = { goals:viewGoals, activities:viewActivities, timeline:viewTimeline, schedule:viewSchedule, data:viewData };
  $("#app").innerHTML = rescueBanner() + (views[S.ui.tab] || viewGoals)();

}
function flowStrip(active){
  const steps = ["Goal", "SMART", "Activities", "Waves", "Estimate", "Timeline", "Calendar"];
  return '<div class="flow no-print"><b>The chain</b>' + steps.map((s,i) =>
    (i ? '<span class="flow-arrow">→</span>' : "") +
    '<span class="flow-step"' + (s.toLowerCase() === active ? ' style="background:var(--bronze);color:#fff;border-color:var(--bronze)"' : "") +
    '>' + s + '</span>').join("") + '</div>';
}

/* ---------------------------------------------------------------- GOALS */
const SMART_FIELDS = [
  ["s","Specific","What exactly will be achieved, by whom, and where? Write it so someone else could tell whether it happened."],
  ["m","Measurable","What number or evidence proves it is done — and what will you check along the way?"],
  ["a","Achievable","What makes this realistic: time, money, skills, support? Name the biggest constraint."],
  ["r","Relevant","Why this, why now? What bigger thing does it serve, and what is the cost of not doing it?"],
  ["t","Time-bound","The deadline, plus any checkpoints. Set the target date on the right so it reaches the timeline."]
];

function viewGoals(){
  const g = currentGoal();
  return flowStrip("goal") +
  '<div class="pagehead"><div><h1>Goals</h1>' +
    '<p>Set the goal, frame it as SMART, then push it down into activities. Everything you enter here flows through to the timeline and the calendar.</p></div>' +
    '<div class="spacer"></div><div class="btnrow no-print"><button class="btn primary" data-act="goal-new">＋ New goal</button></div></div>' +
  '<div class="grid2"><div>' +
    '<h2 class="section-title">Your goals (' + S.goals.length + ')</h2>' +
    (S.goals.length ? '<div class="goal-list">' + (function(){ const F = forecast();
        return S.goals.map(g => goalCard(g, F[g.id])).join(""); })() + '</div>'
                    : '<div class="card pad note">No goals yet. Hit <b>New goal</b>, or load the worked example from the <b>Data</b> tab to see the whole chain filled in.</div>') +
  '</div><div>' + (g ? goalEditor(g) : '<div class="card empty"><h3>Nothing selected</h3><p>Create a goal to start.</p></div>') + '</div></div>';
}

function goalCard(g, f){
  const p = goalProgress(g), sc = smartScore(g), on = currentGoal() && currentGoal().id === g.id;
  const late = g.due && g.due < todayISO() && p < 100;
  const v = (f && g.status === "active") ? verdict(g, f) : null;
  return '<div class="goal-card' + (on ? " on" : "") + '" data-act="goal-select" data-id="' + g.id + '">' +
    '<h3>' + h(g.title) + '</h3>' +
    (g.why ? '<div class="note" style="font-size:12px">' + h(g.why.slice(0,110)) + (g.why.length > 110 ? "…" : "") + '</div>' : "") +
    '<div class="bar"><i style="width:' + p + '%"></i></div>' +
    '<div class="goal-meta">' +
      '<span class="chip' + (sc === 5 ? " ok" : sc >= 3 ? " warn" : " stop") + '">SMART ' + sc + '/5</span>' +
      '<span class="chip">' + p + '% done</span>' +
      '<span class="chip">' + countLeaves(g) + ' tasks</span>' +
      '<span class="chip">' + minsToText(goalEffort(g)) + '</span>' +
      (g.due ? '<span class="chip' + (late ? " stop" : "") + '">due ' + shortDate(g.due) + '</span>' : "") +
      (g.status !== "active" ? '<span class="chip sky">' + h(g.status) + '</span>' : "") +
      (v ? '<span class="chip ' + v.tone + '">' + h(v.text) + '</span>' : "") +
    '</div></div>';
}

function goalEditor(g){
  const sc = smartScore(g);
  const statement = draftStatement(g);
  return '<div class="card pad">' +
    '<div class="btnrow no-print" style="float:right"><button class="btn ghost sm" data-act="goto-activities" data-id="' + g.id + '">Break into activities →</button>' +
      '<button class="iconbtn del" data-act="goal-del" data-id="' + g.id + '" title="Delete goal">✕</button></div>' +
    '<h2 class="section-title">Goal</h2>' +
    '<div class="field"><label>Goal title</label>' +
      '<input type="text" value="' + h(g.title) + '" data-act="goal-field" data-k="title" data-id="' + g.id + '" placeholder="e.g. Build a steady base of regular participants"></div>' +
    '<div class="field"><label>Why it matters</label>' +
      '<textarea data-act="goal-field" data-k="why" data-id="' + g.id + '" placeholder="The reason behind it — what changes for you or the people you support when this is done.">' + h(g.why) + '</textarea></div>' +
    '<div class="inline">' +
      '<div class="field"><label>Start</label><input type="date" value="' + h(g.start) + '" data-act="goal-field" data-k="start" data-id="' + g.id + '"></div>' +
      '<div class="field"><label>Target date</label><input type="date" value="' + h(g.due) + '" data-act="goal-field" data-k="due" data-id="' + g.id + '"></div>' +
      '<div class="field"><label>Status</label><select data-act="goal-field" data-k="status" data-id="' + g.id + '">' +
        ["active","parked","done"].map(s => '<option value="' + s + '"' + (g.status === s ? " selected" : "") + '>' + s + '</option>').join("") +
      '</select></div>' +
    '</div>' +
    '<div class="divider"></div>' +
    '<h2 class="section-title">SMART framing</h2>' +
    '<div class="smart-score"><b>' + sc + '/5</b><span>' +
      (sc === 5 ? "Fully framed — this goal is testable."
       : sc >= 3 ? "Nearly there. The blank rows are where goals usually go soft."
       : "Fill these in before breaking the goal down — vague goals produce vague tasks.") +
    '</span></div>' +
    SMART_FIELDS.map(([k, name, hint]) => {
      const val = g.smart[k] || "";
      return '<div class="smart-row' + (val.trim().length > 2 ? " filled" : "") + '">' +
        '<div class="smart-key">' + k.toUpperCase() + '</div><div>' +
        '<label>' + name + '</label><p class="hint">' + hint + '</p>' +
        '<textarea data-act="smart-field" data-k="' + k + '" data-id="' + g.id + '" placeholder="…">' + h(val) + '</textarea>' +
      '</div></div>';
    }).join("") +
    (statement ? '<div class="field" style="margin-top:4px"><label>Goal statement (auto-drafted)</label>' +
      '<div class="card pad note" style="box-shadow:none;background:var(--paper)">' + h(statement) + '</div></div>' : "") +
  '</div>';
}

/* Stitches S + M + T into one sentence you can read back to yourself. */
function draftStatement(g){
  const s = (g.smart.s || "").trim(), m = (g.smart.m || "").trim(), t = (g.smart.t || "").trim();
  if(!s && !m) return "";
  let out = s || g.title;
  if(m) out += " — measured by: " + m.replace(/\.$/, "");
  let when = t ? (/^by\b/i.test(t) ? t : "By " + t) : (g.due ? "By " + prettyDate(g.due) : "");
  when = when.replace(/\.$/, "");
  out += when ? ". " + when.charAt(0).toUpperCase() + when.slice(1) + "." : ".";
  return out;
}

/* ----------------------------------------------------------- ACTIVITIES */

function stat(v, label){ return '<div class="stat"><b>' + v + '</b><span>' + label + '</span></div>'; }
function maxDepth(g){ let m = 0; eachTask(g.tasks, (t,d) => { if(d > m) m = d; }); return m; }

const STATUSES = [["todo","To do"],["doing","In progress"],["blocked","Blocked"],["done","Done"]];

function nodeHTML(t, depth, idx, count, goalId){
  const leaf = isLeaf(t);
  const eff = effort(t), prog = taskProgress(t), late = isOverdue(t);
  const win = taskWindow(t);
  const ticked = isDone(t);
  return '<div class="node' + (ticked ? " done" : "") + (t.status === "blocked" ? " blocked" : "") + (t.notes ? " open" : "") + '" data-node="' + t.id + '">' +
    '<div class="node-main">' +
      '<button class="tick' + (ticked ? " on" : "") + '" data-act="task-tick" data-id="' + t.id + '" title="' + (leaf ? "Mark done" : "Mark the whole wave done") + '">✓</button>' +
      '<span class="wave-tag" title="Wave ' + depth + (leaf ? " — a task you can actually sit down and do" : " — a container; its wave holds the real work") + '">W' + depth + '</span>' +
      '<input class="node-title" type="text" value="' + h(t.title) + '" data-act="task-field" data-k="title" data-id="' + t.id + '" placeholder="What needs doing?">' +
      (leaf
        ? '<input class="est" type="number" min="0" step="15" value="' + (t.est || "") + '" data-act="task-field" data-k="est" data-id="' + t.id + '" title="How long will it take? In minutes — ' + h(minsToText(t.est)) + '" placeholder="0">' +
          '<span class="unit" title="minutes">min</span>'
        : '<span class="rollup" title="Rolled up from the wave below">Σ ' + minsToText(eff) + ' · ' + prog + '%</span>') +
      '<span class="node-when">' +
        '<input class="dt' + ((leaf ? t.start : win.start) ? "" : " empty") + '" type="date" value="' + h(leaf ? t.start : win.start) + '" data-act="task-field" data-k="start" data-id="' + t.id + '" title="Start — leave blank and the scheduler picks the day"' + (leaf ? "" : " disabled") + '>' +
        '<input class="dt' + ((leaf ? t.due : win.end) ? "" : " empty") + '" type="date" value="' + h(leaf ? t.due : win.end) + '" data-act="task-field" data-k="due" data-id="' + t.id + '" title="Due date"' + (leaf ? "" : " disabled") + '>' +
        '<select class="node-status" data-act="task-field" data-k="status" data-id="' + t.id + '"' + (leaf ? "" : " disabled") + '>' +
          STATUSES.map(([v,l]) => '<option value="' + v + '"' + (t.status === v ? " selected" : "") + '>' + l + '</option>').join("") +
        '</select>' +
      '</span>' +
      (late ? '<span class="chip stop">overdue</span>' : "") +
      '<span class="rowtools no-print" style="display:flex;gap:2px">' +
        '<button class="iconbtn" data-act="task-notes" data-id="' + t.id + '" title="Notes, dates and status">✎</button>' +
        '<button class="iconbtn" data-act="task-wave" data-id="' + t.id + '" title="Break into a wave of smaller tasks">＋ Wave</button>' +
        '<span class="rowmove">' +
          '<button class="iconbtn" data-act="task-up" data-id="' + t.id + '" title="Move up"' + (idx === 0 ? " disabled" : "") + '>↑</button>' +
          '<button class="iconbtn" data-act="task-down" data-id="' + t.id + '" title="Move down"' + (idx === count-1 ? " disabled" : "") + '>↓</button>' +
        '</span>' +
        '<button class="iconbtn del" data-act="task-del" data-id="' + t.id + '" title="Delete">✕</button>' +
      '</span>' +
    '</div>' +
    '<div class="node-extra"><textarea data-act="task-field" data-k="notes" data-id="' + t.id + '" placeholder="Notes, definition of done, links, who else is involved…">' + h(t.notes) + '</textarea></div>' +
    (t.kids.length
      ? '<div class="kids">' + t.kids.map((k,i) => nodeHTML(k, depth+1, i, t.kids.length, goalId)).join("") +
        '<div class="no-print"><button class="btn ghost sm" data-act="task-wave" data-id="' + t.id + '">＋ Add to this wave</button></div></div>'

/* ------------------------------------------------------------- TIMELINE */
const SCALES = { day:{ ppd:34, label:"Day" }, week:{ ppd:13, label:"Week" }, month:{ ppd:4.6, label:"Month" } };

function goalWindow(g){
  let lo = g.start || "", hi = g.due || "";
  g.tasks.forEach(t => {
    const w = taskWindow(t);
    if(w.start && (!lo || w.start < lo)) lo = w.start;
    if(w.end   && (!hi || w.end   > hi)) hi = w.end;
  });
  if(lo && !hi) hi = lo;
  if(hi && !lo) lo = hi;
  return { start: lo, end: hi };
}

function ganttRows(){
  const rows = [];
  S.goals.forEach(g => {
    const w = goalWindow(g);
    rows.push({ kind:"goal", id:g.id, label:g.title, depth:0, start:w.start, end:w.end,
                prog:goalProgress(g), eff:goalEffort(g), done:g.status === "done" });
    if(!(S.ui.collapsed || {})[g.id]){
      allTasks(g).forEach(({ t, depth }) => {
        const tw = taskWindow(t);
        rows.push({ kind:"task", id:t.id, label:t.title, depth: depth+1, start:tw.start, end:tw.end,
                    prog:taskProgress(t), eff:effort(t), done:t.status === "done",
                    leaf:isLeaf(t), late:isOverdue(t), scheduled: !t.start && !t.due && taskBlocks(t.id).length > 0 });
      });
    }
  });
  return rows;
}

function viewTimeline(){
  if(!S.goals.length) return flowStrip("timeline") + '<div class="card empty"><h3>Nothing to plot yet</h3><p>Add a goal and some activities first.</p></div>';
  const rows = ganttRows();
  const dated = rows.filter(r => r.start && r.end);
  const t0 = todayISO();
  let lo = t0, hi = addDays(t0, 21);
  dated.forEach(r => { if(r.start < lo) lo = r.start; if(r.end > hi) hi = r.end; });
  lo = addDays(lo, -3); hi = addDays(hi, 4);
  const span = Math.max(daysBetween(lo, hi) + 1, 14);
  const ppd = SCALES[S.ui.scale] ? SCALES[S.ui.scale].ppd : SCALES.week.ppd;
  const W = Math.round(span * ppd);

  /* header ticks + weekend shading */
  let head = "", grid = "";
  for(let i = 0; i < span; i++){
    const d = addDays(lo, i), dt = parseISO(d), x = Math.round(i * ppd);
    const isMon = dt.getDay() === 1, first = dt.getDate() === 1;
    if(S.ui.scale === "day"){
      head += '<div class="g-tick' + (isMon ? " strong" : "") + '" style="left:' + x + 'px"></div>' +
              '<div class="g-lbl" style="left:' + x + 'px">' + DAYNAME[dt.getDay()][0] + dt.getDate() + '</div>';
      grid += '<div class="g-tick' + (isMon ? " strong" : "") + '" style="left:' + x + 'px"></div>';
    }else if(S.ui.scale === "week"){
      if(isMon){
        head += '<div class="g-tick strong" style="left:' + x + 'px"></div><div class="g-lbl" style="left:' + x + 'px">' + dt.getDate() + '</div>';
        grid += '<div class="g-tick strong" style="left:' + x + 'px"></div>';
      }
    }else if(first){
      head += '<div class="g-tick strong" style="left:' + x + 'px"></div>';
      grid += '<div class="g-tick strong" style="left:' + x + 'px"></div>';
    }
    if(first) head += '<div class="g-mon" style="left:' + x + 'px">' + MONNAME[dt.getMonth()] + " " + String(dt.getFullYear()).slice(2) + '</div>';
    if(ppd >= 10 && (dt.getDay() === 0 || dt.getDay() === 6))
      grid += '<div class="g-weekend" style="left:' + x + 'px;width:' + Math.ceil(ppd) + 'px"></div>';
  }
  const todayX = Math.round(daysBetween(lo, t0) * ppd);
  const todayLine = (todayX >= 0 && todayX <= W) ? '<div class="g-today" style="left:' + todayX + 'px"></div>' : "";

  /* rows */
  const left = rows.map(r => {
    if(r.kind === "goal"){
      const col = (S.ui.collapsed || {})[r.id];
      return '<div class="g-row goalrow"><button class="iconbtn no-print" data-act="g-collapse" data-id="' + r.id + '" title="Collapse">' +
             (col ? "▸" : "▾") + '</button><span title="' + h(r.label) + '">' + h(r.label) + '</span></div>';
    }
    return '<div class="g-row"><span style="padding-left:' + (10 + r.depth * 12) + 'px;color:' + (r.done ? "var(--muted)" : "inherit") +
           '" title="' + h(r.label) + '">' + (r.leaf ? "" : "▸ ") + h(r.label) + '</span></div>';
  }).join("");

  const body = rows.map(r => {
    if(!r.start || !r.end)
      return '<div class="g-row"><div class="g-none">no dates — give it an estimate, then auto-schedule</div></div>';
    const x = Math.round(daysBetween(lo, r.start) * ppd);
    const w = Math.max(Math.round((daysBetween(r.start, r.end) + 1) * ppd), 5);
    const cls = r.kind === "goal" ? "summary" : (r.done ? "done" : r.late ? "late" : "") + (r.scheduled ? " sched" : "");
    const tip = r.label + " · " + shortDate(r.start) + " → " + shortDate(r.end) + " · " + minsToText(r.eff) + " · " + r.prog + "%";
    return '<div class="g-row">' +
      '<div class="g-bar ' + cls + '" style="left:' + x + 'px;width:' + w + 'px" title="' + h(tip) + '">' +
        (r.prog > 0 && !r.done ? '<i class="g-fill" style="width:' + r.prog + '%"></i>' : "") +
      '</div>' +
      '<span class="g-name" style="left:' + (x + w + 7) + 'px">' + h(r.label) + ' · ' + r.prog + '%</span>' +
    '</div>';
  }).join("");

  let undated = 0;
  S.goals.forEach(g => eachTask(g.tasks, t => {
    const w = taskWindow(t);
    if(isLeaf(t) && t.status !== "done" && (!w.start || !w.end)) undated++;
  }));

  return flowStrip("timeline") +
  '<div class="pagehead"><div><h1>Timeline</h1>' +
    '<p>The Gantt view. Solid bars are dates you set; hatched bars are placed by the scheduler. The red line is today.</p></div>' +
    '<div class="spacer"></div><div class="btnrow no-print">' +
      Object.keys(SCALES).map(k => '<button class="btn ' + (S.ui.scale === k ? "primary" : "ghost") + ' sm" data-act="scale" data-k="' + k + '">' + SCALES[k].label + '</button>').join("") +
      '<button class="btn ghost sm" data-act="print">Print</button>' +
    '</div></div>' +
  (undated ? '<div class="card pad no-print" style="margin-bottom:14px;border-left:4px solid var(--warn)"><b>' + undated + ' task' + (undated>1?"s":"") + ' has no place on the timeline.</b> ' +
     'Give each one an estimate on the Activities tab, then run <b>Auto-schedule</b> on the Schedule tab. ' +
     '<button class="btn ghost sm" data-act="tab" data-k="schedule">Go to Schedule</button></div>' : "") +
  '<div class="gantt">' +
    '<div class="g-left"><div class="g-head" style="padding:0 12px;align-items:center"><b style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bronze)">Goal / activity</b></div>' + left + '</div>' +
    '<div class="g-right"><div class="g-canvas" style="width:' + W + 'px">' +
      '<div class="g-head" style="width:' + W + 'px">' + head + '</div>' + todayLine + body +
    '</div></div>' +
  '</div>' +
  '<div class="legend">' +
    '<span><i style="background:var(--charcoal)"></i>Goal (rolled up)</span>' +
    '<span><i style="background:var(--bronze)"></i>Activity</span>' +
    '<span><i style="background:var(--bronze);opacity:.55"></i>Auto-scheduled</span>' +
    '<span><i style="background:var(--ok)"></i>Done</span>' +
    '<span><i style="background:var(--stop)"></i>Overdue</span>' +
  '</div>';
}

/* =====================================================================
   THE WEEK — blocks, free time, filling, and what it all means for the goal
   ---------------------------------------------------------------------
   A block is a real object you can drag, not a number the app recomputed.
   Two kinds:
     busy  — a shift, an appointment. Nothing is ever scheduled over it.
     task  — time set aside for one activity. Pinned once you move it.
   ===================================================================== */
function mondayOf(d){ const w = dow(d); return addDays(d, w === 0 ? -6 : 1 - w); }
function weekStart(){ return S.ui.weekStart || (S.ui.weekStart = mondayOf(todayISO())); }
function weekDates(){ const m = weekStart(); return [0,1,2,3,4,5,6].map(i => addDays(m, i)); }
function goalColour(g){
  const i = S.goals.indexOf(g);
  return g.colour || GOAL_COLOURS[(i < 0 ? 0 : i) % GOAL_COLOURS.length];
}

/* ---------- blocks ---------- */
function newBlock(o){
  return Object.assign({ id:uid(), kind:"task", taskId:null, title:"", date:todayISO(),
                         startMin:9*60, mins:60, pinned:false, done:false, repeat:null, skip:[] }, o);
}
function blockTitle(b){
  if(b.kind === "busy") return b.title || "Busy";
  const hit = b.taskId && findTask(b.taskId);
  return hit ? hit.task.title : (b.title || "Task");
}
function blockGoal(b){
  const hit = b.taskId && findTask(b.taskId);
  return hit ? hit.goal : null;
}
function taskBlocks(taskId){ return S.blocks.filter(b => b.kind === "task" && b.taskId === taskId); }
function scheduledMins(t){ return taskBlocks(t.id).reduce((n,b) => n + b.mins, 0); }
function doneBlockMins(t){ return taskBlocks(t.id).filter(b => b.done).reduce((n,b) => n + b.mins, 0); }
/* Minutes of this task that still have nowhere to happen. */
function toPlace(t){
  if(t.status === "done") return 0;
  return Math.max(0, (Number(t.est) || 0) - scheduledMins(t));
}
/* Minutes of work genuinely left, whether or not it has a slot yet. */
function remainingMins(t){
  if(t.status === "done") return 0;
  return Math.max(0, (Number(t.est) || 0) - doneBlockMins(t));
}
function remainingEffort(g){
  let n = 0;
  eachTask(g.tasks, t => { if(isLeaf(t)) n += remainingMins(t); });
  return n;
}

/* A weekly commitment is stored once and shown on every matching day. */
function blocksOn(d){
  const out = [];
  S.blocks.forEach(b => {
    if(b.date === d){ out.push(b); return; }
    if(b.repeat === "weekly" && b.date < d && dow(b.date) === dow(d) && (b.skip || []).indexOf(d) === -1)
      out.push(Object.assign({}, b, { date:d, instOf:b.id, virtual:true }));
  });
  return out.sort((x,y) => x.startMin - y.startMin);
}
/* Editing one occurrence of a repeat splits it off from the series. */
function materialise(inst){
  const parent = S.blocks.find(b => b.id === inst.instOf);
  if(!parent) return inst;
  parent.skip = (parent.skip || []).concat(inst.date);
  const real = newBlock(Object.assign({}, inst, { id:uid(), repeat:null, skip:[], virtual:false, instOf:null }));
  S.blocks.push(real);
  return real;
}
function realBlock(id, date){
  const b = S.blocks.find(x => x.id === id);
  if(b && (b.repeat !== "weekly" || b.date === date)) return b;
  if(b) return materialise(Object.assign({}, b, { date, instOf:b.id, virtual:true }));
  return null;
}

/* ---------- free time ---------- */
function availOn(d){
  const st = S.settings;
  if((st.availDays || []).indexOf(dow(d)) === -1) return null;
  return [st.availFrom, st.availTo];
}
/* Free stretches inside the hours you said you were free, minus commitments
   and (optionally) the task time already booked. */
function gapsOn(d, countTasks){
  const w = availOn(d);
  if(!w) return [];
  const busy = blocksOn(d)
    .filter(b => b.kind === "busy" || (countTasks && b.kind === "task"))
    .map(b => [b.startMin, b.startMin + b.mins])
    .sort((a,b) => a[0] - b[0]);
  const gaps = [];
  let t = w[0];
  busy.forEach(([s,e]) => {
    if(s > t) gaps.push([t, Math.min(s, w[1])]);
    t = Math.max(t, e);
  });
  if(t < w[1]) gaps.push([t, w[1]]);
  return gaps.filter(g => g[1] - g[0] >= SNAP);
}
function freeMinsOn(d){ return gapsOn(d, false).reduce((n,g) => n + (g[1]-g[0]), 0); }
function freeLeftOn(d){ return gapsOn(d, true).reduce((n,g) => n + (g[1]-g[0]), 0); }

/* ---------- filling ----------
   Only ever places work that has nowhere to be. Never moves a commitment,
   never touches a block you positioned yourself, never books the past. */
function fillWeek(){
  const dates = weekDates().filter(d => d >= todayISO());
  if(!dates.length){ toast("That week has already been and gone."); return; }
  let placed = 0, spare = 0;
  S.goals.forEach(g => {
    if(g.status === "parked") return;
    eachTask(g.tasks, t => {
      if(!isLeaf(t) || t.status === "done") return;
      let need = toPlace(t);
      if(need <= 0) return;
      for(const d of dates){
        if(need <= 0) break;
        if(t.start && d < t.start) continue;      // not allowed to start yet
        for(const [s,e] of gapsOn(d, true)){
          if(need <= 0) break;
          const take = Math.min(need, e - s);
          if(take < SNAP) continue;
          S.blocks.push(newBlock({ kind:"task", taskId:t.id, date:d, startMin:s, mins:take }));
          need -= take; placed++;
        }
      }
      spare += need;
    });
  });
  save();
  toast(placed ? placed + " block" + (placed===1?"":"s") + " added" +
        (spare ? " · " + minsToText(spare) + " would not fit this week" : "")
      : "No free time left this week.");
}
/* Takes back everything the planner placed, leaving your own choices alone. */
function clearAuto(){
  const before = S.blocks.length;
  S.blocks = S.blocks.filter(b => b.kind !== "task" || b.pinned || b.done);
  save(); render();
  toast((before - S.blocks.length) + " placed block(s) cleared.");
}

/* ---------- what actually happened ---------- */
function missedBlocks(){
  const t = todayISO();
  return S.blocks.filter(b => b.kind === "task" && !b.done && b.date < t);
}
function catchUp(){
  const missed = missedBlocks();
  if(!missed.length) return;
  const ids = missed.map(b => b.id);
  S.blocks = S.blocks.filter(b => ids.indexOf(b.id) === -1);
  save();
  fillWeek();
  render();
}
function markMissedDone(){
  missedBlocks().forEach(b => { b.done = true; syncTaskFromBlocks(b.taskId); });
  save(); render();
  toast("Marked as done.");
}
/* A task is finished once its blocks account for the whole estimate. */
function syncTaskFromBlocks(taskId){
  const hit = taskId && findTask(taskId);
  if(!hit) return;
  const t = hit.task;
  const done = doneBlockMins(t);
  if(done >= (Number(t.est) || 0) && done > 0) t.status = "done";
  else if(t.status === "done" && done < (Number(t.est) || 0)) t.status = "doing";
}

/* ---------- the forecast ----------
   Runs your availability forward, week after week, spending it on the work
   that is left in goal order. It answers the only question that matters
   when a plan slips: when does this actually land now? */
function forecast(over){
  const st = over || S.settings;
  const saved = S.settings;
  S.settings = st;
  const res = {};
  let cursor = todayISO(), left = freeMinsOn(cursor), guard = 0;
  const step = () => { cursor = addDays(cursor, 1); left = freeMinsOn(cursor); };
  try{
    if(!(st.availDays || []).length) return res;
    while(left <= 0 && guard++ < 900) step();
    for(const g of S.goals){
      let rem = remainingEffort(g);
      res[g.id] = { remaining: rem, finish: null, over: false };
      if(g.status === "parked" || rem <= 0) continue;
      while(rem > 0){
        if(guard++ > 4000){ res[g.id].over = true; break; }
        if(left <= 0){ step(); continue; }
        const take = Math.min(rem, left);
        rem -= take; left -= take;
        res[g.id].finish = cursor;
      }
    }
  } finally { S.settings = saved; }
  return res;
}
function verdict(g, f){
  if(!f || f.over) return { tone:"stop", text:"beyond two years at this rate" };
  if(!f.finish) return { tone:"ok", text:"nothing left to do" };
  if(!g.due) return { tone:"sky", text:"lands " + shortDate(f.finish) + " — no target set" };
  const slip = daysBetween(g.due, f.finish);
  if(slip <= 0) return { tone:"ok", text:"lands " + shortDate(f.finish) + ", " + weeksText(-slip) + " to spare" };
  return { tone:"stop", text:weeksText(slip) + " past your target" };
}
function weeksText(days){
  if(days < 7) return days + (days === 1 ? " day" : " days");
  const w = Math.round(days/7);
  return w + (w === 1 ? " week" : " weeks");
}
/* Three levers, each priced in a finish date before you pull it. */
function levers(g){
  const st = S.settings, out = [];
  const later = Object.assign({}, st, { availTo: Math.min(T1, st.availTo + 60) });
  out.push({ key:"hour", label:"+1 hour a day", when:(forecast(later)[g.id]||{}).finish });
  if((st.availDays||[]).indexOf(6) === -1){
    const sat = Object.assign({}, st, { availDays: (st.availDays||[]).concat(6).sort() });
    out.push({ key:"sat", label:"Work Saturdays", when:(forecast(sat)[g.id]||{}).finish });
  }
  return out;
}

/* No point drawing 5am when nothing happens before 9. Fit the grid to the
   hours you actually use, plus an hour of room either side. */
function computeView(dates){
  const st = S.settings;
  let lo = st.availFrom, hi = st.availTo;
  dates.forEach(d => blocksOn(d).forEach(b => {
    lo = Math.min(lo, b.startMin);
    hi = Math.max(hi, b.startMin + b.mins);
  }));
  V0 = Math.max(T0, Math.floor((lo - 60) / 60) * 60);
  V1 = Math.min(T1, Math.ceil((hi + 60) / 60) * 60);
  if(V1 - V0 < 360) V1 = Math.min(T1, V0 + 360);
  if(V1 <= V0){ V0 = T0; V1 = T1; }
}
function calHTML(dates){
  computeView(dates);
  const H = Math.round((V1-V0)*PXMIN), vd = S.ui.viewDay|0;
  let head = '<div class="calhead"><div></div>' + dates.map((d,i) =>
    '<div data-d="' + i + '" class="' + (d === todayISO() ? "today " : "") + (i === vd ? "show" : "") + '">' +
    DAYNAME[dow(d)] + '<b>' + parseISO(d).getDate() + '</b></div>').join("") + '</div>';

  let g = '<div class="gutter" style="height:' + H + 'px">';
  for(let m = V0; m <= V1; m += 60) g += '<span style="top:' + Math.round((m-V0)*PXMIN) + 'px">' + hhmm(m) + '</span>';
  g += '</div>';

  dates.forEach((d, i) => {
    const w = availOn(d);
    g += '<div class="col' + (w ? "" : " off") + (i === vd ? " show" : "") + '" data-date="' + d + '" data-d="' + i + '" style="height:' + H + 'px">';
    if(w) g += '<div class="band" style="top:' + Math.round((w[0]-V0)*PXMIN) + 'px;height:' + Math.round((w[1]-w[0])*PXMIN) + 'px"></div>';
    for(let m = V0; m <= V1; m += 30)
      g += '<div class="hr' + (m % 60 ? " half" : "") + '" style="top:' + Math.round((m-V0)*PXMIN) + 'px"></div>';
    if(d === todayISO()){
      const n = new Date(), nm = clampMin(n.getHours()*60 + n.getMinutes());
      if(nm >= V0 && nm <= V1) g += '<div class="now" style="top:' + Math.round((nm-V0)*PXMIN) + 'px"></div>';
    }
    g += blocksOn(d).map(blockHTML).join("");
    g += '</div>';
  });
  return '<div class="cal' + (isNarrow() ? " single" : "") + '">' + head +
         '<div class="calbody"><div class="calgrid">' + g + '</div></div></div>';
}
function clampMin(m){ return Math.max(T0, Math.min(T1, m)); }
function isNarrow(){ return window.innerWidth <= 760; }

function blockHTML(b){
  const goal = blockGoal(b), col = goal ? goalColour(goal) : "";
  const cls = b.kind === "busy" ? "busy"
            : "task" + (b.pinned ? " pinned" : "") + (b.done ? " done" : "");
  const px = Math.max(Math.round(b.mins * PXMIN) - 2, 15);
  const style = 'top:' + Math.round((b.startMin-V0)*PXMIN) + 'px;height:' + px + 'px' +
    (b.kind === "task" && col ? ';--gc:' + col : "");
  return '<div class="blk ' + cls + '" data-id="' + (b.instOf || b.id) + '" data-date="' + b.date + '" style="' + style + '">' +
    (b.kind === "task" ? '<button class="bdone" data-act="block-done" data-id="' + (b.instOf || b.id) +
      '" data-date="' + b.date + '" title="Mark this block done">✓</button>' : "") +
    '<b>' + h(blockTitle(b)) + '</b>' +
    (px >= 34 ? '<small>' + hhmm(b.startMin) + "–" + hhmm(b.startMin + b.mins) + " · " + minsToText(b.mins) +
      (b.repeat === "weekly" ? " · weekly" : "") + '</small>' : "") +
    '<i class="grip"></i></div>';
}


/* ------------------------------------------------- moving things by hand */
let drag = null, bpop = null;

const colAt = x => [...document.querySelectorAll(".col")].find(c => {
  const r = c.getBoundingClientRect();
  return x >= r.left && x <= r.right && r.width > 0;
});
function minsAt(y, col){
  const r = col.getBoundingClientRect();
  const m = Math.round(((y - r.top) / PXMIN) / SNAP) * SNAP + V0;
  return Math.max(V0, Math.min(m, V1));
}
function closeBPop(){ if(bpop){ bpop.remove(); bpop = null; } }

document.addEventListener("pointerdown", e => {
  if(S.ui.tab !== "schedule") return;
  if(e.target.closest(".bdone") || e.target.closest(".bpop")) return;
  closeBPop();

  const chip = e.target.closest("[data-chip]");
  if(chip){
    const hit = findTask(chip.dataset.chip);
    if(!hit) return;
    const dates = weekDates();
    const date = dates[S.ui.viewDay|0] || todayISO();
    const b = newBlock({ kind:"task", taskId:hit.task.id, date,
                         startMin:S.settings.availFrom, mins:Math.min(toPlace(hit.task), 240) || 60, pinned:true });
    S.blocks.push(b);
    render();
    grabBlock(e, b, true);
    e.preventDefault();
    return;
  }

  const el = e.target.closest(".blk");
  if(el){
    const src = S.blocks.find(b => b.id === el.dataset.id);
    if(!src) return;
    drag = { instId:el.dataset.id, instDate:el.dataset.date, b:null, el,
             col:el.closest(".col"), mode:e.target.classList.contains("grip") ? "size" : "move",
             grab:minsAt(e.clientY, el.closest(".col")) - src.startMin, moved:false };
    el.classList.add("dragging");
    el.setPointerCapture(e.pointerId);
    e.preventDefault();
    return;
  }

  const col = e.target.closest(".col");
  if(col){
    const at = minsAt(e.clientY, col);
    const b = newBlock({ kind:"busy", title:"Shift", date:col.dataset.date, startMin:at, mins:SNAP });
    S.blocks.push(b);
    render();
    grabBlock(e, b, true, "size");
    e.preventDefault();
  }
});

function grabBlock(e, b, moved, mode){
  const el = document.querySelector('.blk[data-id="' + b.id + '"]');
  if(!el) return;
  const col = el.closest(".col");
  drag = { instId:b.id, instDate:b.date, b, el, col, mode:mode || "move",
           grab:mode === "size" ? 0 : Math.round(b.mins/2), moved:!!moved };
  el.classList.add("dragging");
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
}

document.addEventListener("pointermove", e => {
  if(!drag) return;
  if(!drag.b){
    drag.b = realBlock(drag.instId, drag.instDate);   // split a repeat only once it really moves
    if(!drag.b){ drag = null; return; }
  }
  drag.moved = true;
  const b = drag.b;
  if(drag.mode === "move"){
    const col = colAt(e.clientX) || drag.col;
    if(col !== drag.col && col.dataset.date){ b.date = col.dataset.date; drag.col = col; }
    b.startMin = Math.max(V0, Math.min(minsAt(e.clientY, col) - drag.grab, V1 - b.mins));
  }else{
    b.mins = Math.max(SNAP, Math.min(minsAt(e.clientY, drag.col) - b.startMin, V1 - b.startMin));
  }
  if(b.kind === "task") b.pinned = true;
  renderGridOnly();
  const el = document.querySelector('.blk[data-id="' + b.id + '"][data-date="' + b.date + '"]');
  if(el){ el.classList.add("dragging"); drag.el = el; drag.col = el.closest(".col"); }
});

document.addEventListener("pointerup", e => {
  if(!drag) return;
  const { b, moved, instId, instDate } = drag;
  drag = null;
  save(); render();
  if(!moved){
    const blk = b || S.blocks.find(x => x.id === instId);
    if(blk) openBlockEditor(instId, instDate, e.clientX, e.clientY);
  }
});

/* Redraw just the columns mid-drag so the whole tab does not flash. */
function renderGridOnly(){
  const cal = document.querySelector(".cal");
  if(!cal) return;
  const body = cal.querySelector(".calgrid");
  const scroll = cal.querySelector(".calbody").scrollTop;
  const dates = weekDates();
  const tmp = document.createElement("div");
  tmp.innerHTML = calHTML(dates);
  body.innerHTML = tmp.querySelector(".calgrid").innerHTML;
  cal.querySelector(".calbody").scrollTop = scroll;

function openBlockEditor(id, date, x, y){
  closeBPop();
  const src = S.blocks.find(b => b.id === id);
  if(!src) return;
  const showing = src.repeat === "weekly" && src.date !== date
    ? Object.assign({}, src, { date, instOf:src.id, virtual:true }) : src;
  const isTask = showing.kind === "task";
  const goal = blockGoal(showing);
  const dates = weekDates();

  bpop = document.createElement("div");
  bpop.className = "bpop";
  bpop.innerHTML =
    '<h3>' + (isTask ? "Task block" : "Fixed commitment") + '</h3>' +
    (isTask
      ? '<p class="bp-task">' + h(blockTitle(showing)) + (goal ? '<span style="color:' + goalColour(goal) + '">' + h(goal.title) + '</span>' : "") + '</p>'
      : '<input type="text" id="bp-title" value="' + h(showing.title) + '" placeholder="Shift, appointment…">') +
    '<div class="bp-row"><button class="step" data-p="-15">−</button><button class="step" data-p="15">+</button>' +
      '<span class="spacer"></span><b>' + hhmm(showing.startMin) + "–" + hhmm(showing.startMin + showing.mins) +
      ' · ' + minsToText(showing.mins) + '</b></div>' +
    '<div class="bp-days">' + dates.map((d,i) =>
      '<button data-p="day:' + d + '" class="' + (d === showing.date ? "on" : "") + '">' + DAYNAME[dow(d)][0] + '</button>').join("") + '</div>' +
    (isTask
      ? '<div class="bp-acts">' +
          '<button class="btn ghost sm" data-p="done">' + (showing.done ? "Not done yet" : "Mark done") + '</button>' +
          (showing.pinned ? '<button class="btn ghost sm" data-p="unpin">Let it move</button>' : "") +
        '</div>'
      : '<label class="bp-rep"><input type="checkbox" data-p="repeat"' + (src.repeat === "weekly" ? " checked" : "") +
        '> Repeats every ' + DAYNAME[dow(showing.date)] + '</label>') +
    '<div class="bp-acts"><button class="btn ghost sm danger" data-p="del">Remove' +
      (src.repeat === "weekly" ? " this one" : "") + '</button>' +
      (src.repeat === "weekly" ? '<button class="btn ghost sm danger" data-p="delall">Remove every week</button>' : "") + '</div>' +
    '<p class="bp-hint">' + (isTask
      ? (showing.pinned ? "You put this here, so Fill leaves it alone." : "Fill may move this to make room.")
      : "Nothing gets scheduled over this.") + '</p>';

  document.body.appendChild(bpop);
  const r = bpop.getBoundingClientRect();
  bpop.style.left = Math.max(8, Math.min(x - 130, innerWidth - r.width - 8)) + "px";
  bpop.style.top  = Math.max(8, Math.min(y + 14, innerHeight - r.height - 8)) + "px";

  const title = bpop.querySelector("#bp-title");
  if(title) title.addEventListener("input", ev => {
    const b = realBlock(id, date); if(b){ b.title = ev.target.value; save(); renderGridOnly(); }
  });

  bpop.addEventListener("click", ev => {
    const t = ev.target.closest("[data-p]");
    if(!t) return;
    const p = t.dataset.p;
    if(p === "delall"){ S.blocks = S.blocks.filter(b => b.id !== id); closeBPop(); save(); render(); return; }
    const b = realBlock(id, date);
    if(!b) return;
    if(p === "-15" || p === "15") b.mins = Math.max(SNAP, Math.min(b.mins + (+p), T1 - b.startMin));
    else if(p.indexOf("day:") === 0) b.date = p.slice(4);
    else if(p === "done"){ b.done = !b.done; syncTaskFromBlocks(b.taskId); }
    else if(p === "unpin") b.pinned = false;
    else if(p === "repeat"){ b.repeat = t.checked ? "weekly" : null; b.skip = []; }
    else if(p === "del"){ S.blocks = S.blocks.filter(z => z !== b); closeBPop(); save(); render(); return; }
    else return;
    if(b.kind === "task" && p !== "unpin" && p !== "done") b.pinned = true;
    save(); render();
    openBlockEditor(b.id, b.date, x, y);
  });
}

/* ------------------------------------------------- calendar export (.ics) */
function stampLocal(dateISO, mins){
  const d = parseISO(dateISO);
  if(!d) return "";
  d.setMinutes(d.getMinutes() + Math.round(mins || 0));
  return "" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + "T" +
         pad(d.getHours()) + pad(d.getMinutes()) + "00";
}
function icsEsc(s){
  return String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/;/g, "\\;")
    .replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
}
function fold(line){
  if(line.length <= 74) return line;
  let out = line.slice(0, 74), rest = line.slice(74);
  while(rest.length > 73){ out += "\r\n " + rest.slice(0, 73); rest = rest.slice(73); }
  return out + (rest ? "\r\n " + rest : "");
}
function taskPath(goal, task){
  const trail = [];
  let cur = findTask(task.id);
  while(cur && cur.parent){ trail.unshift(cur.parent.title); cur = findTask(cur.parent.id); }
  return [goal.title].concat(trail).join(" › ");
}
function buildICS(){
  const now = new Date();
  const dtstamp = "" + now.getUTCFullYear() + pad(now.getUTCMonth()+1) + pad(now.getUTCDate()) + "T" +
                  pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + pad(now.getUTCSeconds()) + "Z";
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//General Disability Support//Goal Studio//EN",
             "CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Goal Studio"];
  const events = [];
  /* Only your own task time goes out. Shifts already live in the roster —
     exporting them would double them up in your calendar. */
  S.blocks.filter(b => b.kind === "task").forEach(b => {
    const hit = b.taskId && findTask(b.taskId);
    if(!hit) return;
    const t = hit.task, g = hit.goal;
    const parts = taskBlocks(t.id).length;
    const desc = "Goal: " + taskPath(g, t) + (t.notes ? "\n\n" + t.notes : "") +
                 "\n\nEstimate: " + minsToText(t.est) + (parts > 1 ? "  (one of " + parts + " blocks)" : "");
    const from = stampLocal(b.date, b.startMin);
    events.push({ from, lines: [
      "BEGIN:VEVENT",
      "UID:" + b.id + "@goalstudio.gds",
      "DTSTAMP:" + dtstamp,
      "DTSTART:" + from,
      "DTEND:" + stampLocal(b.date, b.startMin + b.mins),
      fold("SUMMARY:" + icsEsc(t.title)),
      fold("DESCRIPTION:" + icsEsc(desc)),
      fold("CATEGORIES:" + icsEsc(g.title)),
      "STATUS:" + (b.done ? "COMPLETED" : "CONFIRMED"),
      "END:VEVENT"] });
  });
  events.sort((a, b) => a.from < b.from ? -1 : a.from > b.from ? 1 : 0);
  events.forEach(e => L.push.apply(L, e.lines));
  L.push("END:VCALENDAR");
  return { text: L.join("\r\n"), count: events.length };
}
function gcalLink(b){
  const hit = b.taskId && findTask(b.taskId);
  if(!hit) return "#";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(hit.task.title) +
    "&dates=" + stampLocal(b.date, b.startMin) + "/" + stampLocal(b.date, b.startMin + b.mins) +
    "&details=" + encodeURIComponent("Goal: " + hit.goal.title + (hit.task.notes ? "\n\n" + hit.task.notes : ""));
}
function download(name, text, type){
  const blob = new Blob([text], { type: type || "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
