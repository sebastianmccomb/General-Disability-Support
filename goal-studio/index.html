/* =====================================================================
   ACTIONS
   ===================================================================== */
function newTask(){
  return { id:uid(), title:"", status:"todo", notes:"", est:Number(S.settings.defaultEstimate) || 60,
           start:"", due:"", kids:[] };
}
function newGoal(){
  return { id:uid(), title:"", why:"", status:"active", start:todayISO(), due:"",
           smart:{ s:"", m:"", a:"", r:"", t:"" }, tasks:[] };
}
function removeTask(id){
  const strip = list => {
    const i = list.findIndex(t => t.id === id);
    if(i !== -1){ list.splice(i, 1); return true; }
    return list.some(t => strip(t.kids));
  };
  S.goals.some(g => strip(g.tasks));
}
function moveTask(id, dir){
  const hit = findTask(id);
  if(!hit) return;
  const list = hit.parent ? hit.parent.kids : hit.goal.tasks;
  const i = list.findIndex(t => t.id === id), j = i + dir;
  if(i === -1 || j < 0 || j >= list.length) return;
  list.splice(j, 0, list.splice(i, 1)[0]);
}

function openModal(html){ $("#modal").innerHTML = html; $("#modalbg").classList.add("on"); }
function closeModal(){ $("#modalbg").classList.remove("on"); $("#modal").innerHTML = ""; }

function doAction(act, el){
  const id = el.dataset.id, k = el.dataset.k;
  switch(act){
    case "tab": S.ui.tab = k; save(); render(); window.scrollTo(0,0); return;
    case "goal-new": {
      const g = newGoal();
      S.goals.push(g); S.ui.goalId = g.id; S.ui.tab = "goals";
      save(); render();
      const inp = $('input[data-k="title"][data-id="' + g.id + '"]');
      if(inp) inp.focus();
      return;
    }
    case "goal-select": S.ui.goalId = id; save(); render(); return;
    case "goal-del": {
      const g = S.goals.find(x => x.id === id);
      if(!g) return;
      if(!confirm('Delete "' + (g.title || "this goal") + '" and everything under it?')) return;
      S.goals = S.goals.filter(x => x.id !== id);
      if(S.ui.goalId === id) S.ui.goalId = S.goals.length ? S.goals[0].id : null;
      save(); render(); toast("Goal deleted.");
      return;
    }
    case "goto-activities": S.ui.goalId = id; S.ui.tab = "activities"; save(); render(); window.scrollTo(0,0); return;

    case "task-add": {
      const g = S.goals.find(x => x.id === id) || currentGoal();
      if(!g) return;
      const t = newTask();
      g.tasks.push(t); save(); render();
      focusTask(t.id);
      return;
    }
    case "task-wave": {
      const hit = findTask(id);
      if(!hit) return;
      const t = newTask();
      hit.task.kids.push(t);
      if(hit.task.status === "done") hit.task.status = "doing";
      save(); render(); focusTask(t.id);
      return;
    }
    case "task-tick": {
      const hit = findTask(id);
      if(!hit) return;
      const t = hit.task;
      const next = isDone(t) ? "todo" : "done";
      t.status = next;
      eachTask(t.kids, k => { k.status = next; });
      save(); render();
      return;
    }
    case "task-del": {
      const hit = findTask(id);
      if(!hit) return;
      const kids = allTasks({ tasks:[hit.task] }).length - 1;
      if(kids > 0 && !confirm("Delete this activity and its " + kids + " sub-task(s)?")) return;
      removeTask(id); save(); render();
      return;
    }
    case "task-up":   moveTask(id, -1); save(); render(); return;
    case "task-down": moveTask(id,  1); save(); render(); return;
    case "task-notes": {
      const n = document.querySelector('.node[data-node="' + id + '"]');
      if(n){ n.classList.toggle("open"); const ta = n.querySelector(".node-extra textarea"); if(ta && n.classList.contains("open")) ta.focus(); }
      return;
    }
    case "bulk-open": {
      const hit = findTask(id);
      const where = hit ? "the wave under “" + h(hit.task.title || "this activity") + "”" : "this goal";
      openModal('<h3>Paste a list</h3><p class="note">One activity per line. They land in ' + where +
        ', each with your default estimate of ' + minsToText(S.settings.defaultEstimate) + '.</p>' +
        '<textarea id="bulktext" style="min-height:170px;margin:14px 0" placeholder="Draft the referral one-pager&#10;Call three support coordinators&#10;Set up the follow-up reminder"></textarea>' +
        '<div class="btnrow" style="justify-content:flex-end"><button class="btn ghost" data-act="modal-close">Cancel</button>' +
        '<button class="btn primary" data-act="bulk-save" data-id="' + h(id || "") + '">Add activities</button></div>');
      setTimeout(() => { const t = $("#bulktext"); if(t) t.focus(); }, 30);
      return;
    }
    case "bulk-save": {
      const lines = ($("#bulktext").value || "").split("\n").map(s => s.replace(/^\s*[-*•\d.)\]]+\s*/, "").trim()).filter(Boolean);
      if(!lines.length){ closeModal(); return; }
      const hit = id ? findTask(id) : null;
      const list = hit ? hit.task.kids : (currentGoal() ? currentGoal().tasks : null);
      if(!list){ closeModal(); return; }
      lines.forEach(line => { const t = newTask(); t.title = line; list.push(t); });
      closeModal(); save(); render();
      toast(lines.length + " activities added.");
      return;
    }
    case "modal-close": closeModal(); return;

    case "scale": S.ui.scale = k; save(); render(); return;
    case "g-collapse": (S.ui.collapsed ||= {}); S.ui.collapsed[id] = !S.ui.collapsed[id]; save(); render(); return;

    case "hours": S.ui.hoursOpen = !S.ui.hoursOpen; save(); render(); return;
    case "week":
      S.ui.weekStart = (+k === 0) ? mondayOf(todayISO()) : addDays(weekStart(), 7 * (+k));
      save(); render(); return;
    case "viewday": S.ui.viewDay = +k; save(); render(); return;
    case "fill": fillWeek(); render(); return;
    case "clear-auto": clearAuto(); return;
    case "catchup": catchUp(); return;
    case "missed-done": markMissedDone(); return;
    case "add-busy": {
      const dates = weekDates();
      const d = dates[S.ui.viewDay|0] || todayISO();
      const b = newBlock({ kind:"busy", title:"Shift", date:d, startMin:S.settings.availFrom, mins:240 });
      S.blocks.push(b); save(); render();
      const el = document.querySelector('.blk[data-id="' + b.id + '"]');
      if(el){
        el.scrollIntoView({ block:"center", behavior:"smooth" });
        const r = el.getBoundingClientRect();
        openBlockEditor(b.id, b.date, r.left + 40, r.top);
      }
      return;
    }
    case "availday": {
      const d = +k, list = S.settings.availDays || [];
      S.settings.availDays = list.indexOf(d) !== -1 ? list.filter(x => x !== d) : list.concat(d).sort();
      save(); render(); return;
    }
    case "block-done": {
      const b = realBlock(id, el.dataset.date);
      if(!b) return;
      b.done = !b.done;
      syncTaskFromBlocks(b.taskId);
      save(); render(); return;
    }
    case "lever-open": S.ui.openLever = S.ui.openLever === id ? null : id; save(); render(); return;
    case "lever": {
      const g = S.goals.find(x => x.id === id);
      if(!g) return;
      if(k === "hour")      S.settings.availTo = Math.min(23*60, S.settings.availTo + 60);
      else if(k === "sat")  S.settings.availDays = (S.settings.availDays || []).concat(6).sort();
      else if(k === "move"){
        const f = forecast()[g.id];
        if(f && f.finish){ g.due = f.finish; toast("Target moved to " + prettyDate(f.finish) + "."); }
      }
      S.ui.openLever = null;
      save(); render(); return;
    }
    case "ics": {
      const { text, count } = buildICS();
      if(!count){ toast("Nothing scheduled yet — run Auto-schedule first."); return; }
      download("goal-studio-schedule.ics", text, "text/calendar;charset=utf-8");
      toast(count + " calendar event(s) exported.");
      return;
    }
    case "export":
      download("goal-studio-backup-" + todayISO() + ".json", JSON.stringify(S, null, 2), "application/json");
      toast("Backup downloaded.");
      return;
    case "import": {
      const f = $("#importfile");
      if(f) f.click();
      return;
    }
    case "sample": {
      if(S.goals.length && !confirm("Add the worked example to your existing goals?")) return;
      const added = sampleGoals();
      S.goals = S.goals.concat(added);
      S.ui.goalId = added[0].id;
      S.ui.tab = "goals";
      save(); render(); toast("Example loaded — follow it through the tabs.");
      return;
    }
    case "wipe": {
      if(!confirm("Delete every goal, activity and schedule on this device? Export a backup first if you might want it back.")) return;
      const tab = S.ui.tab;
      S = blank(); S.ui.tab = tab;
      save(); render(); toast("Cleared.");
      return;
    }
    case "print": window.print(); return;
    case "rescue":
      download("goal-studio-unreadable-" + todayISO() + ".json", rawSaved || "", "application/json");
      toast("Downloaded. Send it over if you want it recovered.");
      return;
    case "rescue-reset":
      if(!confirm("Start fresh? Download the file first if you have not — this cannot be undone.")) return;
      loadError = null; rawSaved = null;
      S = blank(); save(); render(); toast("Started fresh.");
      return;
    case "install": doInstall(); return;
  }
}
function focusTask(id){
  const inp = document.querySelector('.node[data-node="' + id + '"] .node-title');
  if(inp){ inp.focus(); inp.scrollIntoView({ block:"center", behavior:"smooth" }); }
}

/* -------------------------------------------------- live, focus-safe edits */
function activityStats(g){
  const spent = g.tasks.reduce((n,t) => n + doneEffort(t), 0);
  return stat(goalProgress(g) + "%", "complete") +
         stat(countLeaves(g), "tasks at the coalface") +
         stat(minsToText(goalEffort(g)), "estimated effort") +
         stat(minsToText(goalEffort(g) - spent), "effort remaining") +
         stat(maxDepth(g) + 1, "waves deep");
}
/* Updates the numbers that depend on other numbers, without rebuilding the
   DOM — so the cursor stays exactly where you left it. */
function refreshRollups(){
  const g = currentGoal();
  if(!g || S.ui.tab !== "activities") return;
  eachTask(g.tasks, t => {
    const node = document.querySelector('.node[data-node="' + t.id + '"]');
    if(!node) return;
    const tick = node.querySelector(":scope > .node-main > .tick");
    if(tick){ const d = isDone(t); tick.classList.toggle("on", d); node.classList.toggle("done", d); }
    if(!isLeaf(t)){
      const r = node.querySelector(":scope > .node-main > .rollup");
      if(r) r.textContent = "Σ " + minsToText(effort(t)) + " · " + taskProgress(t) + "%";
      const w = taskWindow(t);
      const dates = node.querySelectorAll(":scope > .node-main input.dt");
      if(dates[0]){ dates[0].value = w.start || ""; dates[0].classList.toggle("empty", !w.start); }
      if(dates[1]){ dates[1].value = w.end   || ""; dates[1].classList.toggle("empty", !w.end); }
    }
  });
  const box = document.querySelector(".stats");
  if(box) box.innerHTML = activityStats(g);
}
function syncGoalTitle(g){
  const card = document.querySelector('.goal-card[data-id="' + g.id + '"] h3');
  if(card) card.textContent = g.title;
}
function refreshSmart(g){
  const sc = smartScore(g);
  const box = document.querySelector(".smart-score");
  if(box) box.innerHTML = "<b>" + sc + "/5</b><span>" +
    (sc === 5 ? "Fully framed — this goal is testable."
     : sc >= 3 ? "Nearly there. The blank rows are where goals usually go soft."
     : "Fill these in before breaking the goal down — vague goals produce vague tasks.") + "</span>";
  SMART_FIELDS.forEach(([k]) => {
    const ta = document.querySelector('textarea[data-act="smart-field"][data-k="' + k + '"]');
    if(ta) ta.closest(".smart-row").classList.toggle("filled", (g.smart[k] || "").trim().length > 2);
  });
}

function setGoalField(el){
  const g = S.goals.find(x => x.id === el.dataset.id);
  if(!g) return;
  g[el.dataset.k] = el.value;
  if(el.dataset.k === "title") syncGoalTitle(g);
  save();
}
function setSmartField(el){
  const g = S.goals.find(x => x.id === el.dataset.id);
  if(!g) return;
  g.smart[el.dataset.k] = el.value;
  refreshSmart(g);
  save();
}
function setTaskField(el){
  const hit = findTask(el.dataset.id);
  if(!hit) return;
  const t = hit.task, k = el.dataset.k;
  if(k === "est"){
    t.est = Math.max(0, Math.round(Number(el.value) || 0));
    refreshRollups();
  }else if(k === "status"){
    t.status = el.value;
    save(); render();
    return;
  }else{
    t[k] = el.value;
    if(k === "start" || k === "due"){ el.classList.toggle("empty", !el.value); refreshRollups(); }
  }
  save();
}
function setSetting(el){
  const k = el.dataset.k;
  S.settings[k] = k === "defaultEstimate" ? Math.max(0, Math.round(Number(el.value) || 0)) : el.value;
  save();
}
function setAvail(el){
  const k = el.dataset.k;
  S.settings[k] = parseTime(el.value, S.settings[k]);
  if(S.settings.availTo <= S.settings.availFrom)
    S.settings.availTo = clampMin(S.settings.availFrom + 60);
  save(); render();
}

/* =====================================================================
   WIRING
   ===================================================================== */
const CLICK_ACTS = ["tab","goal-new","goal-select","goal-del","goto-activities","task-add","task-wave",
  "task-tick","task-del","task-up","task-down","task-notes","bulk-open","bulk-save","modal-close",
  "scale","g-collapse","ics","export","import","sample","wipe","print","install",
  "week","viewday","fill","clear-auto","catchup","missed-done","add-busy","availday","block-done",
  "lever","lever-open","rescue","rescue-reset","hours"];

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  if(CLICK_ACTS.indexOf(act) === -1) return;
  e.preventDefault();
  doAction(act, el);
});
document.addEventListener("input", e => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  if(act === "goal-field")  setGoalField(el);
  else if(act === "smart-field") setSmartField(el);
  else if(act === "task-field")  setTaskField(el);
});
document.addEventListener("change", e => {
  if(e.target.id === "importfile"){ importBackup(e.target); return; }
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  if(act === "goal-field"){ setGoalField(el); if(el.tagName === "SELECT") render(); }
  else if(act === "task-field") setTaskField(el);
  else if(act === "goal-switch"){ S.ui.goalId = el.value; save(); render(); }
  else if(act === "setting"){ setSetting(el); render(); }
  else if(act === "avail"){ setAvail(el); }
});

function importBackup(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      if(!d || !Array.isArray(d.goals)) throw new Error("not a Goal Studio backup");
      S.goals = d.goals; S.goals.forEach(normaliseGoal);
      S.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {});
      S.ui.goalId = S.goals.length ? S.goals[0].id : null;
      save(); render(); toast("Backup restored — " + S.goals.length + " goal(s).");
    }catch(err){
      toast("That file could not be read as a backup.");
    }
  };
  rd.onerror = () => toast("That file could not be read.");
  rd.readAsText(file);
  input.value = "";
}
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab");
  if(!b) return;
  S.ui.tab = b.dataset.tab; save(); render(); window.scrollTo(0,0);
});
$("#modalbg").addEventListener("click", e => { if(e.target.id === "modalbg") closeModal(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });
window.addEventListener("pagehide", () => {
  if(loadError) return;                      // same rule as save(): never write over a file we could not read
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
});

/* =====================================================================
   INSTALLING AS AN APP
   ===================================================================== */
let installPrompt = null;      // set by Chrome/Edge when the app is installable
let swReady = false;

function isInstalled(){
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
         window.navigator.standalone === true;
}
function isApple(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  installPrompt = e;
  if(S.ui.tab === "data") render();
});
window.addEventListener("appinstalled", () => {
  installPrompt = null;
  toast("Installed. Look for Goal Studio on your home screen.");
  if(S.ui.tab === "data") render();
});

async function doInstall(){
  if(!installPrompt){ toast("Use your browser's menu — see the steps below."); return; }
  installPrompt.prompt();
  try{ await installPrompt.userChoice; }catch(e){}
  installPrompt = null;
  render();
}

/* Offline shell. Registered only over http(s) — opening the file directly
   from disk has no service worker, and that is fine. */
function registerSW(){
  if(!("serviceWorker" in navigator) || location.protocol.indexOf("http") !== 0) return;
  navigator.serviceWorker.register("sw.js").then(reg => {
    swReady = true;
    reg.addEventListener("updatefound", () => {
      const sw = reg.installing;
      if(!sw) return;
      sw.addEventListener("statechange", () => {
        if(sw.state === "installed" && navigator.serviceWorker.controller) toast("Updated — reopen to get the newest version.");
      });
    });
  }).catch(() => {});
}

/* Ask the browser not to evict the plan when it is short of room.
   Chrome decides silently on engagement; Safari and Firefox may ask. */
let askedToPersist = false;
function keepData(){
  if(askedToPersist || !navigator.storage || !navigator.storage.persist) return;
  if(!S.goals.length) return;
  askedToPersist = true;
  navigator.storage.persist().catch(() => {});
}

/* Home-screen shortcuts land here: ?tab=schedule */
function applyLaunchParams(){
  try{
    const q = new URLSearchParams(location.search);
    const tab = q.get("tab");
    if(tab && ["goals","activities","timeline","schedule","data"].indexOf(tab) !== -1) S.ui.tab = tab;
  }catch(e){}
}

/* ------------------------------------------------------------------- boot */
if(!S.ui.goalId && S.goals.length) S.ui.goalId = S.goals[0].id;
applyLaunchParams();
render();
registerSW();
$("#savechip").textContent = S.goals.length ? "Saved locally" : "Ready";
</script>
